<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReadOff — Lector</title>
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/js/tw.js"></script>
<link rel="stylesheet" href="/css/theme.css">
<script>try{if(localStorage.getItem("theme")==="light")document.documentElement.classList.add("light")}catch(e){}</script>
<style>
  body{margin:0;overscroll-behavior:none}
  ::-webkit-scrollbar{display:none}

  /* Tema propio del lector (independiente del tema de la app) */
  #reader{ --rd-bg:#12151c; --rd-fg:#e6e1d8; --rd-muted:#8e98a8; --rd-rule:#2e3646; }
  #reader[data-rt="sepia"]{ --rd-bg:#f2e9d8; --rd-fg:#3b3227; --rd-muted:#8a7a63; --rd-rule:#ddcdb0; }
  #reader[data-rt="claro"]{ --rd-bg:#fbfaf7; --rd-fg:#23262c; --rd-muted:#6b7280; --rd-rule:#e2e0da; }
  #reader{ background:var(--rd-bg); color:var(--rd-fg); transition:background .2s,color .2s; }

  #chapter-body{ font-family:'Lora',Georgia,serif; }
  #chapter-body.sans{ font-family:'Plus Jakarta Sans',system-ui,sans-serif; }
  #chapter-body p{ margin:0 0 1.1em; }
  #chapter-body p:last-child{ margin-bottom:0; }
  .rd-rule{ border-color:var(--rd-rule); }
  .rd-muted{ color:var(--rd-muted); }
</style>
</head>
<body class="bg-background font-sans text-body-md text-on-background min-h-screen selection:bg-primary selection:text-on-primary">

<!-- Barra superior -->
<header class="fixed top-0 left-0 right-0 z-40 bg-surface/90 backdrop-blur-xl border-b border-surface-container-highest/40">
  <div class="h-14 max-w-[1100px] mx-auto px-gutter-mobile flex items-center gap-element-gap-sm">
    <a id="back-link" href="/duelos" class="shrink-0 p-2 rounded-lg text-on-surface-variant hover:text-primary hover:bg-surface-container-high transition-all" aria-label="Volver al duelo">
      <span class="material-symbols-outlined align-middle">arrow_back</span>
    </a>
    <div class="min-w-0 flex-1">
      <p class="font-serif text-headline-sm text-on-surface truncate leading-tight" id="book-title">…</p>
      <p class="font-sans text-label-sm text-outline truncate" id="chapter-label">Cargando…</p>
    </div>
    <button id="btn-settings" class="shrink-0 p-2 rounded-lg text-on-surface-variant hover:text-primary hover:bg-surface-container-high transition-all" aria-label="Ajustes de lectura" type="button">
      <span class="material-symbols-outlined align-middle">text_fields</span>
    </button>
  </div>
  <div class="h-1 bg-surface-container-lowest">
    <div class="h-full bg-gradient-to-r from-tertiary-container to-primary transition-all duration-300" id="progress-bar" style="width:0%"></div>
  </div>
</header>

<!-- Panel de ajustes -->
<div id="settings" class="hidden fixed top-14 left-0 right-0 z-40 bg-surface-container-low/98 backdrop-blur-xl border-b border-surface-container-highest/50 shadow-2xl">
  <div class="max-w-[1100px] mx-auto px-gutter-mobile py-card-padding-sm flex flex-col gap-element-gap-lg">

    <div class="flex items-center justify-between gap-element-gap-md flex-wrap">
      <span class="font-sans text-label-md text-on-surface-variant shrink-0">Tipo de letra</span>
      <div class="flex gap-1 p-1 rounded-lg bg-surface-container-lowest">
        <button data-font="serif" class="opt-font px-4 py-1.5 rounded font-sans text-label-md transition-all" style="font-family:Lora,serif" type="button">Serif</button>
        <button data-font="sans" class="opt-font px-4 py-1.5 rounded font-sans text-label-md transition-all" type="button">Sans</button>
      </div>
    </div>

    <div class="flex items-center justify-between gap-element-gap-md flex-wrap">
      <span class="font-sans text-label-md text-on-surface-variant shrink-0">Tamaño</span>
      <div class="flex items-center gap-element-gap-sm">
        <button id="size-minus" class="w-10 h-9 rounded-lg bg-surface-container-high hover:bg-surface-container-highest text-on-surface transition-all active:scale-95" type="button">
          <span class="material-symbols-outlined text-[18px] align-middle">remove</span>
        </button>
        <span class="font-sans text-label-md text-primary font-bold w-14 text-center" id="size-label">18px</span>
        <button id="size-plus" class="w-10 h-9 rounded-lg bg-surface-container-high hover:bg-surface-container-highest text-on-surface transition-all active:scale-95" type="button">
          <span class="material-symbols-outlined text-[18px] align-middle">add</span>
        </button>
      </div>
    </div>

    <div class="flex items-center justify-between gap-element-gap-md flex-wrap">
      <span class="font-sans text-label-md text-on-surface-variant shrink-0">Interlineado</span>
      <div class="flex gap-1 p-1 rounded-lg bg-surface-container-lowest">
        <button data-lh="1.5" class="opt-lh px-4 py-1.5 rounded font-sans text-label-md transition-all" type="button">Compacto</button>
        <button data-lh="1.8" class="opt-lh px-4 py-1.5 rounded font-sans text-label-md transition-all" type="button">Normal</button>
        <button data-lh="2.1" class="opt-lh px-4 py-1.5 rounded font-sans text-label-md transition-all" type="button">Amplio</button>
      </div>
    </div>

    <div class="flex items-center justify-between gap-element-gap-md flex-wrap">
      <span class="font-sans text-label-md text-on-surface-variant shrink-0">Ancho de columna</span>
      <div class="flex gap-1 p-1 rounded-lg bg-surface-container-lowest">
        <button data-w="620" class="opt-w px-4 py-1.5 rounded font-sans text-label-md transition-all" type="button">Estrecho</button>
        <button data-w="760" class="opt-w px-4 py-1.5 rounded font-sans text-label-md transition-all" type="button">Medio</button>
        <button data-w="920" class="opt-w px-4 py-1.5 rounded font-sans text-label-md transition-all" type="button">Ancho</button>
      </div>
    </div>

    <div class="flex items-center justify-between gap-element-gap-md flex-wrap">
      <span class="font-sans text-label-md text-on-surface-variant shrink-0">Tema de lectura</span>
      <div class="flex gap-1 p-1 rounded-lg bg-surface-container-lowest">
        <button data-rt="oscuro" class="opt-rt px-4 py-1.5 rounded font-sans text-label-md transition-all" type="button">Oscuro</button>
        <button data-rt="sepia" class="opt-rt px-4 py-1.5 rounded font-sans text-label-md transition-all" type="button">Sepia</button>
        <button data-rt="claro" class="opt-rt px-4 py-1.5 rounded font-sans text-label-md transition-all" type="button">Claro</button>
      </div>
    </div>
  </div>
</div>

<!-- Lectura -->
<main id="reader" class="min-h-screen pt-14">
  <div class="mx-auto px-gutter-mobile md:px-gutter-tablet py-stack-gap-xl" id="reader-inner" style="max-width:760px">

    <div id="loading" class="flex items-center justify-center gap-2 py-24 rd-muted">
      <span class="material-symbols-outlined animate-spin">progress_activity</span> Cargando capítulo…
    </div>

    <article id="chapter-wrap" class="hidden">
      <p class="font-sans text-label-sm rd-muted uppercase tracking-[0.2em] mb-2" id="chapter-kicker"></p>
      <h1 class="font-serif text-headline-xl md:text-display-hero mb-element-gap-lg" id="chapter-title"></h1>
      <div class="w-16 border-t rd-rule mb-stack-gap-xl"></div>
      <div id="chapter-body" style="font-size:18px;line-height:1.8"></div>
    </article>

    <div id="error-box" class="hidden flex-col items-center text-center gap-element-gap-md py-24">
      <span class="material-symbols-outlined text-error text-[40px]">error</span>
      <p class="font-sans text-body-md rd-muted" id="error-msg"></p>
      <a id="error-back" href="/duelos" class="font-sans text-label-md text-primary hover:underline">← Volver al duelo</a>
    </div>

    <!-- Navegación inferior -->
    <nav id="nav-bottom" class="hidden mt-stack-gap-xl pt-element-gap-lg border-t rd-rule flex-col gap-element-gap-md">
      <p class="font-sans text-body-sm rd-muted text-center" id="mark-hint"></p>
      <div class="flex items-center gap-element-gap-md">
        <button id="btn-prev" class="shrink-0 inline-flex items-center gap-1.5 px-4 py-3 rounded-lg bg-surface-container-high hover:bg-surface-container-highest text-on-surface font-sans text-label-md transition-all active:scale-95 disabled:opacity-30 disabled:pointer-events-none" type="button">
          <span class="material-symbols-outlined text-[18px]">chevron_left</span><span class="hidden sm:inline">Anterior</span>
        </button>
        <a id="btn-duel" href="/duelos" class="flex-1 text-center px-4 py-3 rounded-lg bg-surface-container-high hover:bg-surface-container-highest text-on-surface-variant font-sans text-label-md transition-all">
          Ver duelo
        </a>
        <button id="btn-next" class="shrink-0 inline-flex items-center gap-1.5 px-5 py-3 rounded-lg bg-primary-container hover:bg-tertiary-fixed-dim text-on-primary-container font-sans text-label-md font-bold shadow-lg shadow-primary-container/25 transition-all active:scale-95 disabled:opacity-30 disabled:pointer-events-none" type="button">
          <span class="hidden sm:inline">Siguiente</span><span class="material-symbols-outlined text-[18px]">chevron_right</span>
        </button>
      </div>
    </nav>
  </div>
</main>

<script src="/js/app.js"></script>
<script>
const params = new URLSearchParams(location.search);
const duelId = params.get('duelo');
let current = parseInt(params.get('cap'), 10) || 1;
let duelInfo = null;

/* ---------- Preferencias de lectura ---------- */
const PREFS_KEY = 'readerPrefs';
const defaults = { font: 'serif', size: 18, lh: '1.8', w: '760', rt: 'oscuro' };
let prefs = { ...defaults };
try { prefs = { ...defaults, ...JSON.parse(localStorage.getItem(PREFS_KEY) || '{}') }; } catch {}

function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch {} }

function applyPrefs() {
  const body = document.getElementById('chapter-body');
  body.classList.toggle('sans', prefs.font === 'sans');
  body.style.fontSize = prefs.size + 'px';
  body.style.lineHeight = prefs.lh;
  document.getElementById('reader-inner').style.maxWidth = prefs.w + 'px';
  document.getElementById('reader').dataset.rt = prefs.rt;
  document.getElementById('size-label').textContent = prefs.size + 'px';

  const on = 'bg-surface-container-highest text-primary font-bold';
  const mark = (sel, attr, val) =>
    document.querySelectorAll(sel).forEach((b) => {
      const active = b.dataset[attr] === String(val);
      b.classList.toggle('bg-surface-container-highest', active);
      b.classList.toggle('text-primary', active);
      b.classList.toggle('font-bold', active);
      b.classList.toggle('text-on-surface-variant', !active);
    });
  mark('.opt-font', 'font', prefs.font);
  mark('.opt-lh', 'lh', prefs.lh);
  mark('.opt-w', 'w', prefs.w);
  mark('.opt-rt', 'rt', prefs.rt);
  savePrefs();
}

document.getElementById('btn-settings').addEventListener('click', () =>
  document.getElementById('settings').classList.toggle('hidden')
);
document.querySelectorAll('.opt-font').forEach((b) => b.addEventListener('click', () => { prefs.font = b.dataset.font; applyPrefs(); }));
document.querySelectorAll('.opt-lh').forEach((b) => b.addEventListener('click', () => { prefs.lh = b.dataset.lh; applyPrefs(); }));
document.querySelectorAll('.opt-w').forEach((b) => b.addEventListener('click', () => { prefs.w = b.dataset.w; applyPrefs(); }));
document.querySelectorAll('.opt-rt').forEach((b) => b.addEventListener('click', () => { prefs.rt = b.dataset.rt; applyPrefs(); }));
document.getElementById('size-minus').addEventListener('click', () => { prefs.size = Math.max(14, prefs.size - 1); applyPrefs(); });
document.getElementById('size-plus').addEventListener('click', () => { prefs.size = Math.min(28, prefs.size + 1); applyPrefs(); });

/* ---------- Carga de capítulos ---------- */
function renderBody(text) {
  const body = document.getElementById('chapter-body');
  body.replaceChildren();
  String(text).split(/\n+/).map((s) => s.trim()).filter(Boolean).forEach((par) => {
    const p = document.createElement('p');
    p.textContent = par; // texto plano: nada de HTML de la fuente
    body.appendChild(p);
  });
}

async function loadChapter(n, push = true) {
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('chapter-wrap').classList.add('hidden');
  document.getElementById('nav-bottom').classList.add('hidden');
  document.getElementById('error-box').classList.add('hidden');
  document.getElementById('error-box').classList.remove('flex');
  try {
    const { chapter, duel } = await api(`/api/duels/${duelId}/chapters/${n}`);
    duelInfo = duel;
    current = chapter.number;

    document.getElementById('book-title').textContent = duel.bookTitle;
    document.getElementById('chapter-label').textContent = `Capítulo ${chapter.number} de ${duel.totalChapters}`;
    document.getElementById('chapter-kicker').textContent = `Capítulo ${chapter.number}`;
    document.getElementById('chapter-title').textContent = chapter.title || `Capítulo ${chapter.number}`;
    renderBody(chapter.body);

    document.getElementById('progress-bar').style.width = Math.round((chapter.number / duel.totalChapters) * 100) + '%';
    document.getElementById('btn-prev').disabled = !chapter.hasPrev;
    const next = document.getElementById('btn-next');
    next.querySelector('span:first-child').textContent = chapter.hasNext ? 'Siguiente' : 'Terminar';

    const hint = document.getElementById('mark-hint');
    if (duel.status === 'waiting') hint.textContent = 'El duelo aún no arranca: se marcará cuando tu rival se una.';
    else if (duel.myRead >= chapter.number) hint.textContent = `Ya tienes registrados ${duel.myRead} capítulos.`;
    else hint.textContent = chapter.hasNext
      ? `Al pasar al capítulo ${chapter.number + 1} se registrará tu lectura hasta el ${chapter.number}.`
      : 'Al terminar se registrará el libro completo.';

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('chapter-wrap').classList.remove('hidden');
    document.getElementById('nav-bottom').classList.remove('hidden');
    document.getElementById('nav-bottom').classList.add('flex');
    applyPrefs();
    window.scrollTo({ top: 0 });
    if (push) history.pushState({ n: chapter.number }, '', `/leer?duelo=${duelId}&cap=${chapter.number}`);
    document.title = `Cap. ${chapter.number} — ${duel.bookTitle}`;
  } catch (err) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('error-msg').textContent = err.message;
    const box = document.getElementById('error-box');
    box.classList.remove('hidden');
    box.classList.add('flex');
  }
}

/* Marca la lectura hasta el capítulo dado (silencioso: no interrumpe la lectura) */
async function markUpTo(n) {
  if (!duelInfo || duelInfo.status === 'waiting' || duelInfo.myRead >= n) return;
  try {
    const { duel } = await api(`/api/duels/${duelId}/read-upto`, { method: 'POST', body: { upTo: n } });
    duelInfo.myRead = duel.myStats.chaptersRead;
    if (duel.status === 'finished' && duel.iWon) toast('🏆 ¡Terminaste el libro! Eres el campeón del duelo', 'ok');
    else toast(`Capítulo ${n} registrado ✓`, 'ok');
  } catch (err) { toast(err.message); }
}

document.getElementById('btn-next').addEventListener('click', async () => {
  await markUpTo(current); // al pasar de capítulo, el actual queda leído
  if (current < duelInfo.totalChapters) loadChapter(current + 1);
  else window.location.href = '/duelo?id=' + duelId;
});
document.getElementById('btn-prev').addEventListener('click', () => { if (current > 1) loadChapter(current - 1); });

window.addEventListener('popstate', (e) => {
  const n = (e.state && e.state.n) || parseInt(new URLSearchParams(location.search).get('cap'), 10) || 1;
  loadChapter(n, false);
});

// Flechas del teclado para navegar
document.addEventListener('keydown', (e) => {
  if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight') document.getElementById('btn-next').click();
  if (e.key === 'ArrowLeft') document.getElementById('btn-prev').click();
});

(async () => {
  try { await api('/api/me'); } catch { window.location.href = '/'; return; }
  if (!duelId) { window.location.href = '/duelos'; return; }
  document.getElementById('back-link').href = '/duelo?id=' + duelId;
  document.getElementById('btn-duel').href = '/duelo?id=' + duelId;
  document.getElementById('error-back').href = '/duelo?id=' + duelId;
  applyPrefs();
  await loadChapter(current, false);
  history.replaceState({ n: current }, '', `/leer?duelo=${duelId}&cap=${current}`);
})();
</script>
</body>
</html>
