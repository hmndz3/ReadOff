<style>
  body{margin:0;overscroll-behavior:none}
  ::-webkit-scrollbar{display:none}

  /* Tema propio del lector (independiente del tema de la app) */
  #reader{ --rd-bg:#12151c; --rd-fg:#e6e1d8; --rd-muted:#8e98a8; --rd-rule:#2e3646; }
  #reader[data-rt="sepia"]{ --rd-bg:#f2e9d8; --rd-fg:#3b3227; --rd-muted:#8a7a63; --rd-rule:#ddcdb0; }
  #reader[data-rt="claro"]{ --rd-bg:#fbfaf7; --rd-fg:#23262c; --rd-muted:#6b7280; --rd-rule:#e2e0da; }
  #reader{ background:var(--rd-bg); color:var(--rd-fg); transition:background .2s,color .2s; }

  #chapter-body{ font-family:'Lora',Georgia,serif; }
  #chapter-body.sans{ font-family:'Plus Jakarta Sans',system-ui,sans-serif; }
  #chapter-body p{ margin:0 0 1.1em; }
  #chapter-body p:last-child{ margin-bottom:0; }
  .rd-rule{ border-color:var(--rd-rule); }
  .rd-muted{ color:var(--rd-muted); }

  /* Marcas sobre el texto: ámbar para lo subrayado (privado) y turquesa para lo
     que tiene una pregunta encima (compartido). No añaden nodos de texto al
     párrafo, así que no descuadran las posiciones guardadas. */
  #chapter-body mark{ background:transparent; color:inherit; border-radius:2px; padding:0 1px; }
  #chapter-body mark.marca-hl{ background:rgba(245,166,35,.26); box-shadow:0 1px 0 rgba(245,166,35,.85); cursor:pointer; }
  #chapter-body mark.marca-q{ background:rgba(3,198,178,.2); box-shadow:0 1px 0 rgba(68,226,205,.9); cursor:pointer; }
  #chapter-body mark.marca-q:hover{ background:rgba(3,198,178,.34); }
  #chapter-body mark.marca-hl:hover{ background:rgba(245,166,35,.4); }
  #chapter-body mark.resaltada{ animation:marca-late 1.6s ease-out 2; }
  @keyframes marca-late{ 0%,100%{ box-shadow:0 1px 0 rgba(68,226,205,.9) } 50%{ box-shadow:0 0 0 4px rgba(68,226,205,.35) } }

  /* Burbuja flotante sobre la selección */
  #burbuja{ position:fixed; z-index:45; display:none; gap:2px; padding:4px; white-space:nowrap;
    background:rgb(var(--tk-surface-container-high)); border:1px solid rgb(var(--tk-surface-container-highest));
    border-radius:10px; box-shadow:0 14px 30px -12px rgba(0,0,0,.85); }
  #burbuja.ver{ display:flex; }
  #burbuja button{ display:inline-flex; align-items:center; gap:5px; border:none; background:transparent;
    color:rgb(var(--tk-on-surface)); font-family:'Plus Jakarta Sans',sans-serif; font-size:12px; font-weight:600;
    padding:7px 10px; border-radius:7px; cursor:pointer; }
  #burbuja button:hover{ background:rgb(var(--tk-surface-container-highest)); }
  #burbuja .sep{ width:1px; margin:4px 2px; background:rgb(var(--tk-surface-container-highest)); }
  @media (prefers-reduced-motion:reduce){ #chapter-body mark.resaltada{ animation:none } }
</style>
</head>

<script>
const params = new URLSearchParams(location.search);
const duelId = params.get('duelo');
let current = parseInt(params.get('cap'), 10) || 1;
let duelInfo = null;

/* ---------- Preferencias de lectura ---------- */
const PREFS_KEY = 'readerPrefs';
const defaults = { font: 'serif', size: 18, lh: '1.8', w: '760', rt: 'oscuro' };
let prefs = { ...defaults };
try { prefs = { ...defaults, ...JSON.parse(localStorage.getItem(PREFS_KEY) || '{}') }; } catch {}

function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch {} }

function applyPrefs() {
  const body = document.getElementById('chapter-body');
  body.classList.toggle('sans', prefs.font === 'sans');
  body.style.fontSize = prefs.size + 'px';
  body.style.lineHeight = prefs.lh;
  document.getElementById('reader-inner').style.maxWidth = prefs.w + 'px';
  document.getElementById('reader').dataset.rt = prefs.rt;
  document.getElementById('size-label').textContent = prefs.size + 'px';

  const on = 'bg-surface-container-highest text-primary font-bold';
  const mark = (sel, attr, val) =>
    document.querySelectorAll(sel).forEach((b) => {
      const active = b.dataset[attr] === String(val);
      b.classList.toggle('bg-surface-container-highest', active);
      b.classList.toggle('text-primary', active);
      b.classList.toggle('font-bold', active);
      b.classList.toggle('text-on-surface-variant', !active);
    });
  mark('.opt-font', 'font', prefs.font);
  mark('.opt-lh', 'lh', prefs.lh);
  mark('.opt-w', 'w', prefs.w);
  mark('.opt-rt', 'rt', prefs.rt);
  savePrefs();
  if (typeof remedirYActualizar === 'function') setTimeout(remedirYActualizar, 0);
}

document.getElementById('btn-settings').addEventListener('click', () =>
  document.getElementById('settings').classList.toggle('hidden')
);
document.querySelectorAll('.opt-font').forEach((b) => b.addEventListener('click', () => { prefs.font = b.dataset.font; applyPrefs(); }));
document.querySelectorAll('.opt-lh').forEach((b) => b.addEventListener('click', () => { prefs.lh = b.dataset.lh; applyPrefs(); }));
document.querySelectorAll('.opt-w').forEach((b) => b.addEventListener('click', () => { prefs.w = b.dataset.w; applyPrefs(); }));
document.querySelectorAll('.opt-rt').forEach((b) => b.addEventListener('click', () => { prefs.rt = b.dataset.rt; applyPrefs(); }));
document.getElementById('size-minus').addEventListener('click', () => { prefs.size = Math.max(14, prefs.size - 1); applyPrefs(); });
document.getElementById('size-plus').addEventListener('click', () => { prefs.size = Math.min(28, prefs.size + 1); applyPrefs(); });

/* ---------- Carga de capítulos ---------- */
let PARRAFOS = []; // texto plano de cada párrafo, tal y como se guardan las citas
function renderBody(text) {
  const body = document.getElementById('chapter-body');
  body.replaceChildren();
  PARRAFOS = String(text).split(/\n+/).map((s) => s.trim()).filter(Boolean);
  PARRAFOS.forEach((par, i) => {
    const p = document.createElement('p');
    p.dataset.i = i;
    p.textContent = par; // texto plano: nada de HTML de la fuente
    body.appendChild(p);
  });
}

/* ---------- Subrayados y preguntas sobre el texto ----------
   Una marca se guarda como la cita más el párrafo y el desplazamiento donde
   empieza. Al volver se busca primero en esa posición y, si la fuente cambió
   algo, por el texto de la cita; si ya no aparece, la marca simplemente no se
   pinta y la pregunta sigue viva en su pantalla. */
let SUBRAYADOS = [];
let PREGUNTAS = [];
let CONTEXTO = { rival: null, rivalRead: null, myRead: 0, tapadas: 0 };
let seleccion = null; // { paraIndex, start, end, cita }

function posicionDe(texto, cita, offset) {
  if (!cita) return null;
  if (Number.isInteger(offset)) {
    if (texto.substr(offset, cita.length) === cita) return offset;
    const cerca = texto.indexOf(cita, Math.max(0, offset - 120));
    if (cerca >= 0) return cerca;
  }
  const i = texto.indexOf(cita);
  return i >= 0 ? i : null;
}

// Resuelve una marca a { paraIndex, start, end } sobre el texto ya pintado.
function ubicar(marca) {
  const i = Number.isInteger(marca.paraIndex) ? marca.paraIndex : -1;
  if (i >= 0 && i < PARRAFOS.length) {
    const pos = posicionDe(PARRAFOS[i], marca.quote, marca.charOffset);
    if (pos !== null) return { paraIndex: i, start: pos, end: pos + marca.quote.length };
  }
  for (let j = 0; j < PARRAFOS.length; j++) {
    const pos = posicionDe(PARRAFOS[j], marca.quote, null);
    if (pos !== null) return { paraIndex: j, start: pos, end: pos + marca.quote.length };
  }
  return null;
}

function pintarMarcas() {
  const body = document.getElementById('chapter-body');
  const porParrafo = new Map();
  const añadir = (marca, tipo) => {
    if (!marca.quote) return;
    const u = ubicar(marca);
    if (!u) return;
    if (!porParrafo.has(u.paraIndex)) porParrafo.set(u.paraIndex, []);
    porParrafo.get(u.paraIndex).push({ ...u, tipo, id: marca.id });
  };
  SUBRAYADOS.forEach((h) => añadir(h, 'hl'));
  PREGUNTAS.filter((q) => !q.hidden).forEach((q) => añadir(q, 'q'));

  body.querySelectorAll('p[data-i]').forEach((p) => {
    const i = parseInt(p.dataset.i, 10);
    const texto = PARRAFOS[i];
    const marcas = (porParrafo.get(i) || []).sort((a, b) => a.start - b.start || b.end - a.end);
    if (!marcas.length) {
      if (p.childNodes.length !== 1 || p.firstChild.nodeType !== 3) p.textContent = texto;
      return;
    }
    p.replaceChildren();
    let cursor = 0;
    for (const m of marcas) {
      if (m.start < cursor) continue; // solapadas: gana la primera
      if (m.start > cursor) p.appendChild(document.createTextNode(texto.slice(cursor, m.start)));
      const mk = document.createElement('mark');
      mk.className = m.tipo === 'q' ? 'marca-q' : 'marca-hl';
      mk.dataset.tipo = m.tipo;
      mk.dataset.id = m.id;
      if (m.tipo === 'q') mk.id = 'q' + m.id;
      mk.textContent = texto.slice(m.start, m.end);
      p.appendChild(mk);
      cursor = m.end;
    }
    if (cursor < texto.length) p.appendChild(document.createTextNode(texto.slice(cursor)));
  });

  // Contador de la barra y aviso de las que llegan tapadas.
  const cuenta = document.getElementById('q-count');
  const visibles = PREGUNTAS.length;
  cuenta.textContent = visibles;
  cuenta.classList.toggle('hidden', visibles === 0);

  const aviso = document.getElementById('tapadas');
  const n = PREGUNTAS.filter((q) => q.hidden).length;
  aviso.classList.toggle('hidden', n === 0);
  aviso.classList.toggle('flex', n > 0);
  if (n > 0) {
    document.getElementById('tapadas-texto').textContent =
      `${n} pregunta${n === 1 ? '' : 's'} de este capítulo te llega${n === 1 ? '' : 'n'} tapada${n === 1 ? '' : 's'}: vas por el capítulo ${CONTEXTO.myRead}. Ábrela${n === 1 ? '' : 's'} en la pantalla de preguntas.`;
  }
  setTimeout(remedirYActualizar, 0);
}

async function cargarMarcas(n) {
  try {
    const [subs, pregs] = await Promise.all([
      api(`/api/duels/${duelId}/highlights?chapter=${n}`),
      api(`/api/duels/${duelId}/questions?chapter=${n}`),
    ]);
    SUBRAYADOS = subs.highlights;
    PREGUNTAS = pregs.questions;
    CONTEXTO = { rival: pregs.rival, rivalRead: pregs.rivalRead, myRead: pregs.me.chaptersRead };
    pintarMarcas();
    irAlAncla();
  } catch {} // sin marcas se lee igual
}

// Al llegar desde la pantalla de preguntas con #q<id> se resalta ese fragmento.
function irAlAncla() {
  if (!location.hash.startsWith('#q')) return;
  const el = document.getElementById(location.hash.slice(1));
  if (!el) return;
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  el.classList.add('resaltada');
}

/* ---------- Selección ---------- */
function parrafoDe(nodo) {
  const el = nodo && (nodo.nodeType === 1 ? nodo : nodo.parentElement);
  return el ? el.closest('#chapter-body p[data-i]') : null;
}

// Desplazamiento de un punto del DOM dentro del texto plano del párrafo. Se
// recorren los nodos de texto porque las marcas ya pintadas lo trocean.
function offsetEn(p, nodo, off) {
  let total = 0;
  const w = document.createTreeWalker(p, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) {
    if (n === nodo) return total + off;
    total += n.nodeValue.length;
  }
  return null;
}

const MAX_CITA = 300;

function leerSeleccion() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) return null;
  const r = sel.getRangeAt(0);
  const p = parrafoDe(r.startContainer);
  if (!p) return null;
  const i = parseInt(p.dataset.i, 10);
  const texto = PARRAFOS[i];
  let start = offsetEn(p, r.startContainer, r.startOffset);
  // Si la selección cruza párrafos se queda con el primero: la cita que se
  // guarda es justo la que se ve en el compositor, sin sorpresas.
  const mismo = parrafoDe(r.endContainer) === p;
  let end = mismo ? offsetEn(p, r.endContainer, r.endOffset) : texto.length;
  if (start === null || end === null || end <= start) return null;
  while (start < end && /\s/.test(texto[start])) start++;
  while (end > start && /\s/.test(texto[end - 1])) end--;
  if (end - start > MAX_CITA) end = start + MAX_CITA;
  const cita = texto.slice(start, end);
  if (!cita.trim()) return null;
  return { paraIndex: i, start, end, cita, rect: r.getBoundingClientRect() };
}

function colocarBurbuja(rect) {
  const b = document.getElementById('burbuja');
  b.classList.add('ver');
  const ancho = b.offsetWidth;
  const alto = b.offsetHeight;
  let x = rect.left + rect.width / 2 - ancho / 2;
  x = Math.max(8, Math.min(x, window.innerWidth - ancho - 8));
  let y = rect.top - alto - 10;
  if (y < 70) y = rect.bottom + 10; // debajo si arriba está la barra
  b.style.left = Math.round(x) + 'px';
  b.style.top = Math.round(y) + 'px';
}

function ocultarBurbuja() {
  document.getElementById('burbuja').classList.remove('ver');
}

function revisarSeleccion() {
  const s = leerSeleccion();
  if (!s) { ocultarBurbuja(); seleccion = null; return; }
  seleccion = s;
  colocarBurbuja(s.rect);
}

['mouseup', 'touchend', 'keyup'].forEach((ev) =>
  document.getElementById('chapter-body').addEventListener(ev, () => setTimeout(revisarSeleccion, 0))
);
document.addEventListener('mousedown', (e) => {
  if (!document.getElementById('burbuja').contains(e.target)) ocultarBurbuja();
});
window.addEventListener('scroll', ocultarBurbuja, { passive: true });

/* ---------- Acciones de la burbuja ---------- */
async function subrayar() {
  if (!seleccion) return;
  try {
    const { highlight } = await api(`/api/duels/${duelId}/highlights`, {
      method: 'POST',
      body: { chapter: current, quote: seleccion.cita, paraIndex: seleccion.paraIndex, charOffset: seleccion.start },
    });
    SUBRAYADOS.push(highlight);
    window.getSelection().removeAllRanges();
    pintarMarcas();
  } catch (err) { toast(err.message); }
}

function abrirCompositor() {
  if (!seleccion) return;
  const c = document.getElementById('composer');
  document.getElementById('composer-cita').textContent = seleccion.cita;
  const aviso = document.getElementById('composer-aviso');
  if (CONTEXTO.rival && CONTEXTO.rivalRead !== null) {
    const nombre = CONTEXTO.rival.displayName.split(' ')[0];
    const tapa = current > CONTEXTO.rivalRead;
    aviso.innerHTML = tapa
      ? `<span translate="no" class="material-symbols-outlined text-[15px] text-error">lock</span> ${esc(nombre)} va por el cap. ${CONTEXTO.rivalRead}: le llegará tapada como spoiler.`
      : `<span translate="no" class="material-symbols-outlined text-[15px] text-secondary">visibility</span> ${esc(nombre)} ya pasó este capítulo: la verá completa.`;
  } else {
    aviso.textContent = 'Todavía no hay rival en el duelo.';
  }
  c.classList.remove('hidden');
  const t = document.getElementById('composer-texto');
  t.value = '';
  c.scrollIntoView({ block: 'center', behavior: 'smooth' });
  t.focus();
}

async function publicarPregunta() {
  const texto = document.getElementById('composer-texto').value.trim();
  if (!texto) { document.getElementById('composer-texto').focus(); return; }
  if (!seleccion) return;
  try {
    const { question } = await api(`/api/duels/${duelId}/questions`, {
      method: 'POST',
      body: {
        chapter: current,
        text: texto,
        quote: seleccion.cita,
        paraIndex: seleccion.paraIndex,
        charOffset: seleccion.start,
      },
    });
    PREGUNTAS.unshift(question);
    document.getElementById('composer').classList.add('hidden');
    window.getSelection().removeAllRanges();
    pintarMarcas();
    toast(question.spoilerForRival ? 'Pregunta publicada — a tu rival le llega tapada' : 'Pregunta publicada', 'ok');
  } catch (err) { toast(err.message); }
}

document.getElementById('burbuja').addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  if (!b || !seleccion) return;
  const act = b.dataset.act;
  ocultarBurbuja();
  if (act === 'subrayar') subrayar();
  else if (act === 'preguntar') abrirCompositor();
  else if (act === 'copiar') {
    try { await navigator.clipboard.writeText(seleccion.cita); toast('Cita copiada', 'ok'); }
    catch { toast('No se pudo copiar'); }
  }
});
document.getElementById('composer-cancelar').addEventListener('click', () =>
  document.getElementById('composer').classList.add('hidden')
);
document.getElementById('composer-enviar').addEventListener('click', publicarPregunta);

/* Tocar una marca: la pregunta se abre en su pantalla, el subrayado se quita. */
document.getElementById('chapter-body').addEventListener('click', async (e) => {
  const mk = e.target.closest('mark[data-tipo]');
  if (!mk) return;
  if (mk.dataset.tipo === 'q') {
    window.location.href = `/preguntas?duelo=${duelId}#q${mk.dataset.id}`;
    return;
  }
  const ok = await confirmDialog({
    title: '¿Quitar este subrayado?',
    message: mk.textContent.slice(0, 120),
    confirmText: 'Quitar',
  });
  if (!ok) return;
  try {
    await api(`/api/highlights/${mk.dataset.id}`, { method: 'DELETE' });
    SUBRAYADOS = SUBRAYADOS.filter((h) => String(h.id) !== String(mk.dataset.id));
    pintarMarcas();
  } catch (err) { toast(err.message); }
});

/* ---------- Tiempo de lectura real ----------
   Solo se cuenta el tiempo con la pestaña visible y con actividad reciente, así
   que el total subestima antes que inflar: una pestaña abierta toda la noche no
   suma. Se guarda por tramos para no perder la sesión si el navegador muere. */
const TICK_MS = 5000;
const IDLE_MS = 120000; // sin scroll ni toques se deja de contar
const FLUSH_MS = 120000; // cada dos minutos de lectura se manda el tramo
const MIN_ENVIO_MS = 5000; // abrir y cerrar el capítulo no es una lectura

let sesion = { cap: null, activeMs: 0, words: 0, scrollPct: 0, ultimaActividad: 0 };

function marcarActividad() {
  sesion.ultimaActividad = Date.now();
}
['scroll', 'touchstart', 'keydown', 'pointerdown', 'wheel'].forEach((ev) =>
  window.addEventListener(ev, marcarActividad, { passive: true })
);

function enviarSesion(conBeacon) {
  const { cap, activeMs, words, scrollPct } = sesion;
  if (cap === null || activeMs < MIN_ENVIO_MS) return;
  sesion.activeMs = 0; // este tramo ya queda contabilizado
  const cuerpo = { chapter: cap, activeMs, words, scrollPct: Math.round(scrollPct) };
  const url = `/api/duels/${duelId}/reading-session`;
  if (conBeacon && navigator.sendBeacon) {
    // Al ocultar o cerrar la pestaña un fetch normal se cancela; el beacon no.
    try {
      navigator.sendBeacon(url, new Blob([JSON.stringify(cuerpo)], { type: 'application/json' }));
      return;
    } catch {} // sin beacon se intenta igual por fetch
  }
  api(url, { method: 'POST', body: cuerpo }).catch(() => {});
}

function iniciarSesion(numero, texto) {
  enviarSesion(false); // cierra el capítulo anterior
  sesion = {
    cap: numero,
    activeMs: 0,
    words: String(texto || '').split(/\s+/).filter(Boolean).length,
    scrollPct: 0,
    ultimaActividad: Date.now(),
  };
}

let ultimoScrollY = 0;
setInterval(() => {
  if (sesion.cap === null || document.visibilityState !== 'visible') return;
  // No se depende solo del evento de scroll: si la posición cambió, hubo
  // lectura, aunque el navegador no haya emitido el evento. De paso se
  // refresca el avance del capítulo por si el evento tampoco llegó.
  if (window.scrollY !== ultimoScrollY) {
    ultimoScrollY = window.scrollY;
    marcarActividad();
    updateChapterProgress();
  }
  if (Date.now() - sesion.ultimaActividad > IDLE_MS) return;
  sesion.activeMs += TICK_MS;
  if (sesion.activeMs >= FLUSH_MS) enviarSesion(false);
}, TICK_MS);

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') enviarSesion(true);
  else marcarActividad(); // al volver no se cobra el tiempo que estuvo oculta
});
window.addEventListener('pagehide', () => enviarSesion(true));

/* Progreso dentro del capítulo: 0% al empezar, 100% cuando el final del
   artículo llega al borde inferior de la ventana.
   Las medidas del artículo se cachean: sólo cambian al cargar un capítulo,
   al tocar la tipografía o al redimensionar, así el scroll no fuerza layout. */
let artTop = 0;
let artAlto = 0;

function medirArticulo() {
  const art = document.getElementById('chapter-wrap');
  if (!art || art.classList.contains('hidden')) { artAlto = 0; return; }
  const rect = art.getBoundingClientRect();
  artTop = rect.top + window.scrollY;
  artAlto = rect.height;
}

const HEADER_ALTO = 64; // barra superior fija (56px + las dos barras de 4px)

function updateChapterProgress() {
  const bar = document.getElementById('chapter-bar');
  if (!bar || !artAlto) return;
  // 0% con el capítulo sin empezar y 100% cuando su última línea queda a la
  // vista. El recorrido se mide en scroll, no en "cuánto cabe en pantalla",
  // para que abrir un capítulo marque cero y terminarlo marque cien.
  const inicio = Math.max(0, artTop - HEADER_ALTO);
  const fin = artTop + artAlto - window.innerHeight;
  const recorrido = fin - inicio;
  const pct = recorrido <= 0 ? 100 : Math.min(100, Math.max(0, ((window.scrollY - inicio) / recorrido) * 100));
  bar.style.width = pct + '%';
  const lbl = document.getElementById('chapter-pct');
  if (lbl) lbl.textContent = Math.round(pct) + '%';
  if (pct > sesion.scrollPct) sesion.scrollPct = pct; // lo mas lejos que se llego
}

function remedirYActualizar() {
  medirArticulo();
  updateChapterProgress();
}

// Sin requestAnimationFrame a propósito: se pausa con la pestaña en segundo
// plano y dejaría la barra congelada al volver.
window.addEventListener('scroll', updateChapterProgress, { passive: true });
window.addEventListener('resize', remedirYActualizar);

async function loadChapter(n, push = true) {
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('chapter-wrap').classList.add('hidden');
  document.getElementById('nav-bottom').classList.add('hidden');
  document.getElementById('error-box').classList.add('hidden');
  document.getElementById('error-box').classList.remove('flex');
  // Las marcas del capítulo anterior no valen para este.
  document.getElementById('composer').classList.add('hidden');
  document.getElementById('tapadas').classList.add('hidden');
  ocultarBurbuja();
  SUBRAYADOS = [];
  PREGUNTAS = [];
  try {
    const { chapter, duel } = await api(`/api/duels/${duelId}/chapters/${n}`);
    duelInfo = duel;
    current = chapter.number;

    document.getElementById('book-title').textContent = duel.bookTitle;
    iniciarSesion(chapter.number, chapter.body);
    // Minutos estimados con el ritmo del propio lector cuando ya hay medidas
    // suyas; si no, con 240 ppm.
    const minutos = Math.max(1, Math.round(sesion.words / (duel.wpm || 240)));
    document.getElementById('chapter-label').innerHTML =
      `Capítulo ${chapter.number} de ${duel.totalChapters} · <span id="chapter-pct" class="text-secondary font-semibold">0%</span> · ~${minutos} min`;
    document.getElementById('chapter-kicker').textContent = `Capítulo ${chapter.number}`;
    document.getElementById('chapter-title').textContent = chapter.title || `Capítulo ${chapter.number}`;
    renderBody(chapter.body);

    document.getElementById('progress-bar').style.width = Math.round((chapter.number / duel.totalChapters) * 100) + '%';
    document.getElementById('btn-prev').disabled = !chapter.hasPrev;
    const next = document.getElementById('btn-next');
    next.querySelector('span:first-child').textContent = chapter.hasNext ? 'Siguiente' : 'Terminar';

    const hint = document.getElementById('mark-hint');
    if (duel.status === 'waiting') hint.textContent = 'El duelo aún no arranca: se marcará cuando tu rival se una.';
    else if (duel.myRead >= chapter.number) hint.textContent = `Ya tienes registrados ${duel.myRead} capítulos.`;
    else hint.textContent = chapter.hasNext
      ? `Al pasar al capítulo ${chapter.number + 1} se registrará tu lectura hasta el ${chapter.number}.`
      : 'Al terminar se registrará el libro completo.';

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('chapter-wrap').classList.remove('hidden');
    document.getElementById('nav-bottom').classList.remove('hidden');
    document.getElementById('nav-bottom').classList.add('flex');
    applyPrefs();
    window.scrollTo({ top: 0 });
    document.getElementById('chapter-bar').style.width = '0%';
    // Tras pintar: el alto definitivo depende de la tipografía ya aplicada.
    setTimeout(remedirYActualizar, 0);
    cargarMarcas(chapter.number); // subrayados y preguntas, sin frenar la lectura
    if (push) history.pushState({ n: chapter.number }, '', `/leer?duelo=${duelId}&cap=${chapter.number}`);
    document.title = `Cap. ${chapter.number} — ${duel.bookTitle}`;
  } catch (err) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('error-msg').textContent = err.message;
    const box = document.getElementById('error-box');
    box.classList.remove('hidden');
    box.classList.add('flex');
  }
}

/* Marca la lectura hasta el capítulo dado (silencioso: no interrumpe la lectura) */
async function markUpTo(n) {
  if (!duelInfo || duelInfo.status === 'waiting' || duelInfo.myRead >= n) return;
  try {
    const { duel } = await api(`/api/duels/${duelId}/read-upto`, { method: 'POST', body: { upTo: n } });
    duelInfo.myRead = duel.myStats.chaptersRead;
    if (duel.status === 'finished' && duel.iWon) toast('🏆 ¡Terminaste el libro! Eres el campeón del duelo', 'ok');
    else toast(`Capítulo ${n} registrado ✓`, 'ok');
  } catch (err) { toast(err.message); }
}

document.getElementById('btn-next').addEventListener('click', async () => {
  await markUpTo(current); // al pasar de capítulo, el actual queda leído
  if (current < duelInfo.totalChapters) loadChapter(current + 1);
  else window.location.href = '/duelo?id=' + duelId;
});
document.getElementById('btn-prev').addEventListener('click', () => { if (current > 1) loadChapter(current - 1); });

window.addEventListener('popstate', (e) => {
  const n = (e.state && e.state.n) || parseInt(new URLSearchParams(location.search).get('cap'), 10) || 1;
  loadChapter(n, false);
});

// Flechas del teclado para navegar
document.addEventListener('keydown', (e) => {
  if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight') document.getElementById('btn-next').click();
  if (e.key === 'ArrowLeft') document.getElementById('btn-prev').click();
});

(async () => {
  try { await api('/api/me'); } catch { window.location.href = '/'; return; }
  if (!duelId) { window.location.href = '/duelos'; return; }
  document.getElementById('back-link').href = '/duelo?id=' + duelId;
  document.getElementById('btn-duel').href = '/duelo?id=' + duelId;
  document.getElementById('error-back').href = '/duelo?id=' + duelId;
  document.getElementById('link-preguntas').href = '/preguntas?duelo=' + duelId;
  document.getElementById('tapadas').href = '/preguntas?duelo=' + duelId;
  applyPrefs();
  await loadChapter(current, false);
  history.replaceState({ n: current }, '', `/leer?duelo=${duelId}&cap=${current}`);
})();
</script>
</body>
</html>
