<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReadOff — Lector</title>
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

<link rel="stylesheet" href="/css/theme.css">
<script>try{if(localStorage.getItem("theme")==="light")document.documentElement.classList.add("light")}catch(e){}</script>
<style>
  body{margin:0;overscroll-behavior:none}
  ::-webkit-scrollbar{display:none}

  /* Tema propio del lector (independiente del tema de la app) */
  #reader{ --rd-bg:#12151c; --rd-fg:#e6e1d8; --rd-muted:#8e98a8; --rd-rule:#2e3646; }
  #reader[data-rt="sepia"]{ --rd-bg:#f2e9d8; --rd-fg:#3b3227; --rd-muted:#8a7a63; --rd-rule:#ddcdb0; }
  #reader[data-rt="claro"]{ --rd-bg:#fbfaf7; --rd-fg:#23262c; --rd-muted:#6b7280; --rd-rule:#e2e0da; }
  #reader{ background:var(--rd-bg); color:var(--rd-fg); transition:background .2s,color .2s; }

  #chapter-body{ font-family:'Lora',Georgia,serif; }
  #chapter-body.sans{ font-family:'Plus Jakarta Sans',system-ui,sans-serif; }
  #chapter-body p{ margin:0 0 1.1em; }
  #chapter-body p:last-child{ margin-bottom:0; }
  .rd-rule{ border-color:var(--rd-rule); }
  .rd-muted{ color:var(--rd-muted); }

  /* Marcas sobre el texto: ámbar para lo subrayado (privado) y turquesa para lo
     que tiene una pregunta encima (compartido). No añaden nodos de texto al
     párrafo, así que no descuadran las posiciones guardadas. */
  #chapter-body mark{ background:transparent; color:inherit; border-radius:2px; padding:0 1px; }
  #chapter-body mark.marca-hl{ background:rgba(245,166,35,.26); box-shadow:0 1px 0 rgba(245,166,35,.85); cursor:pointer; }
  #chapter-body mark.marca-q{ background:rgba(3,198,178,.2); box-shadow:0 1px 0 rgba(68,226,205,.9); cursor:pointer; }
  #chapter-body mark.marca-q:hover{ background:rgba(3,198,178,.34); }
  #chapter-body mark.marca-hl:hover{ background:rgba(245,166,35,.4); }
  #chapter-body mark.resaltada{ animation:marca-late 1.6s ease-out 2; }
  /* Frase que va diciendo la voz */
  #chapter-body mark.marca-tts{ background:rgba(255,200,128,.18); box-shadow:inset 0 -2px 0 rgba(255,200,128,.7); border-radius:3px; }

  /* Barra del lector en voz alta */
  #tts{ position:fixed; left:50%; transform:translateX(-50%); z-index:44;
    bottom:calc(14px + env(safe-area-inset-bottom, 0px));
    display:none; align-items:center; gap:4px; padding:6px;
    background:rgb(var(--tk-surface-container-high)); border:1px solid rgb(var(--tk-surface-container-highest));
    border-radius:999px; box-shadow:0 16px 36px -14px rgba(0,0,0,.85);
    max-width:calc(100vw - 24px); }
  #tts.ver{ display:flex; }
  #tts button{ display:inline-flex; align-items:center; justify-content:center; border:none; background:transparent;
    color:rgb(var(--tk-on-surface)); border-radius:999px; cursor:pointer; padding:8px; transition:background .13s,color .13s; }
  #tts button:hover{ background:rgb(var(--tk-surface-container-highest)); }
  #tts button:disabled{ opacity:.35; pointer-events:none; }
  #tts #tts-play{ background:rgb(var(--tk-primary-container)); color:rgb(var(--tk-on-primary-container)); }
  #tts #tts-play:hover{ filter:brightness(1.08); }
  #tts .chip{ font-family:'Plus Jakarta Sans',sans-serif; font-size:12px; font-weight:700; padding:7px 10px; white-space:nowrap; }
  #tts #tts-pos{ font-family:'Plus Jakarta Sans',sans-serif; font-size:11px; color:rgb(var(--tk-outline)); padding:0 6px; white-space:nowrap; }
  @media (max-width:420px){ #tts #tts-pos{ display:none } }
  /* Con la barra abierta, el texto deja sitio para que no tape la última línea. */
  body.con-voz #reader-inner{ padding-bottom:96px; }
  /* Los avisos suben para no quedar debajo de la barra. */
  body.con-voz #toast{ bottom:5.5rem; }

  /* Menú de velocidades, justo encima de la barra */
  #tts-menu{ position:fixed; left:50%; transform:translateX(-50%); z-index:46;
    bottom:calc(72px + env(safe-area-inset-bottom, 0px));
    display:none; flex-direction:column; gap:1px; padding:5px; min-width:168px;
    background:rgb(var(--tk-surface-container-high)); border:1px solid rgb(var(--tk-surface-container-highest));
    border-radius:12px; box-shadow:0 16px 36px -14px rgba(0,0,0,.85); }
  #tts-menu.ver{ display:flex; }
  #tts-menu button{ display:flex; align-items:center; justify-content:space-between; gap:14px;
    border:none; background:transparent; color:rgb(var(--tk-on-surface));
    font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; font-weight:700;
    padding:8px 11px; border-radius:8px; cursor:pointer; }
  #tts-menu button:hover{ background:rgb(var(--tk-surface-container-highest)); }
  #tts-menu button.activo{ background:rgb(var(--tk-primary-container)); color:rgb(var(--tk-on-primary-container)); }
  #tts-menu .dur{ font-weight:600; opacity:.75; font-size:12px; }
  @keyframes marca-late{ 0%,100%{ box-shadow:0 1px 0 rgba(68,226,205,.9) } 50%{ box-shadow:0 0 0 4px rgba(68,226,205,.35) } }

  /* Burbuja flotante sobre la selección */
  #burbuja{ position:fixed; z-index:45; display:none; gap:2px; padding:4px; white-space:nowrap;
    background:rgb(var(--tk-surface-container-high)); border:1px solid rgb(var(--tk-surface-container-highest));
    border-radius:10px; box-shadow:0 14px 30px -12px rgba(0,0,0,.85); }
  #burbuja.ver{ display:flex; }
  #burbuja button{ display:inline-flex; align-items:center; gap:5px; border:none; background:transparent;
    color:rgb(var(--tk-on-surface)); font-family:'Plus Jakarta Sans',sans-serif; font-size:12px; font-weight:600;
    padding:7px 10px; border-radius:7px; cursor:pointer; }
  #burbuja button:hover{ background:rgb(var(--tk-surface-container-highest)); }
  #burbuja .sep{ width:1px; margin:4px 2px; background:rgb(var(--tk-surface-container-highest)); }
  @media (prefers-reduced-motion:reduce){ #chapter-body mark.resaltada{ animation:none } }
</style>
</head>
<body translate="no" class="bg-background font-sans text-body-md text-on-background min-h-screen selection:bg-primary selection:text-on-primary">

<!-- Barra superior -->
<header class="fixed top-0 left-0 right-0 z-40 bg-surface/90 backdrop-blur-xl border-b border-surface-container-highest/40">
  <div class="h-14 max-w-[1100px] mx-auto px-gutter-mobile flex items-center gap-element-gap-sm">
    <a id="back-link" href="/duelos" class="shrink-0 p-2 rounded-lg text-on-surface-variant hover:text-primary hover:bg-surface-container-high transition-all" aria-label="Volver al duelo">
      <span translate="no" class="material-symbols-outlined align-middle">arrow_back</span>
    </a>
    <div class="min-w-0 flex-1">
      <p class="font-serif text-headline-sm text-on-surface truncate leading-tight" id="book-title">…</p>
      <p class="font-sans text-label-sm text-outline truncate" id="chapter-label">Cargando…</p>
    </div>
    <button id="btn-voz" class="shrink-0 p-2 rounded-lg text-on-surface-variant hover:text-primary hover:bg-surface-container-high transition-all" aria-label="Escuchar el capítulo" type="button">
      <span translate="no" class="material-symbols-outlined align-middle">headphones</span>
    </button>
    <a id="link-preguntas" href="/duelos" class="shrink-0 relative p-2 rounded-lg text-on-surface-variant hover:text-secondary hover:bg-surface-container-high transition-all" aria-label="Preguntas del duelo">
      <span translate="no" class="material-symbols-outlined align-middle">help</span>
      <span id="q-count" class="hidden absolute -top-0.5 -right-0.5 min-w-[16px] h-4 px-1 rounded-full bg-secondary-container text-on-secondary-container font-sans text-[9px] font-extrabold leading-4 text-center"></span>
    </a>
    <button id="btn-settings" class="shrink-0 p-2 rounded-lg text-on-surface-variant hover:text-primary hover:bg-surface-container-high transition-all" aria-label="Ajustes de lectura" type="button">
      <span translate="no" class="material-symbols-outlined align-middle">text_fields</span>
    </button>
  </div>
  <div class="h-1 bg-surface-container-lowest" title="Progreso del libro">
    <div class="h-full bg-primary-container transition-all duration-300" id="progress-bar" style="width:0%"></div>
  </div>
  <div class="h-1 bg-surface-container-lowest/50" title="Progreso del capítulo">
    <div class="h-full bg-secondary-container" id="chapter-bar" style="width:0%"></div>
  </div>
</header>

<!-- Panel de ajustes -->
<div id="settings" class="hidden fixed top-16 left-0 right-0 z-40 bg-surface-container-low/98 backdrop-blur-xl border-b border-surface-container-highest/50 shadow-2xl">
  <div class="max-w-[1100px] mx-auto px-gutter-mobile py-card-padding-sm flex flex-col gap-element-gap-lg">

    <div class="flex items-center justify-between gap-element-gap-md flex-wrap">
      <span class="font-sans text-label-md text-on-surface-variant shrink-0">Tipo de letra</span>
      <div class="flex gap-1 p-1 rounded-lg bg-surface-container-lowest">
        <button data-font="serif" class="opt-font px-4 py-1.5 rounded font-sans text-label-md transition-all" style="font-family:Lora,serif" type="button">Serif</button>
        <button data-font="sans" class="opt-font px-4 py-1.5 rounded font-sans text-label-md transition-all" type="button">Sans</button>
      </div>
    </div>

    <div class="flex items-center justify-between gap-element-gap-md flex-wrap">
      <span class="font-sans text-label-md text-on-surface-variant shrink-0">Tamaño</span>
      <div class="flex items-center gap-element-gap-sm">
        <button id="size-minus" class="w-10 h-9 rounded-lg bg-surface-container-high hover:bg-surface-container-highest text-on-surface transition-all active:scale-95" type="button">
          <span translate="no" class="material-symbols-outlined text-[18px] align-middle">remove</span>
        </button>
        <span class="font-sans text-label-md text-primary font-bold w-14 text-center" id="size-label">18px</span>
        <button id="size-plus" class="w-10 h-9 rounded-lg bg-surface-container-high hover:bg-surface-container-highest text-on-surface transition-all active:scale-95" type="button">
          <span translate="no" class="material-symbols-outlined text-[18px] align-middle">add</span>
        </button>
      </div>
    </div>

    <div class="flex items-center justify-between gap-element-gap-md flex-wrap">
      <span class="font-sans text-label-md text-on-surface-variant shrink-0">Interlineado</span>
      <div class="flex gap-1 p-1 rounded-lg bg-surface-container-lowest">
        <button data-lh="1.5" class="opt-lh px-4 py-1.5 rounded font-sans text-label-md transition-all" type="button">Compacto</button>
        <button data-lh="1.8" class="opt-lh px-4 py-1.5 rounded font-sans text-label-md transition-all" type="button">Normal</button>
        <button data-lh="2.1" class="opt-lh px-4 py-1.5 rounded font-sans text-label-md transition-all" type="button">Amplio</button>
      </div>
    </div>

    <div class="flex items-center justify-between gap-element-gap-md flex-wrap">
      <span class="font-sans text-label-md text-on-surface-variant shrink-0">Ancho de columna</span>
      <div class="flex gap-1 p-1 rounded-lg bg-surface-container-lowest">
        <button data-w="620" class="opt-w px-4 py-1.5 rounded font-sans text-label-md transition-all" type="button">Estrecho</button>
        <button data-w="760" class="opt-w px-4 py-1.5 rounded font-sans text-label-md transition-all" type="button">Medio</button>
        <button data-w="920" class="opt-w px-4 py-1.5 rounded font-sans text-label-md transition-all" type="button">Ancho</button>
      </div>
    </div>

    <div class="flex items-center justify-between gap-element-gap-md flex-wrap" id="fila-voz">
      <span class="font-sans text-label-md text-on-surface-variant shrink-0">
        Voz que lee
        <span id="cuenta-voces" class="block font-sans text-label-sm text-outline normal-case"></span>
      </span>
      <div class="flex items-center gap-element-gap-sm min-w-0">
        <select id="sel-voz" class="min-w-0 max-w-[230px] rounded-lg bg-surface-container-lowest border border-surface-container-highest px-3 py-2 font-sans text-label-md text-on-surface outline-none focus:border-primary-container"></select>
        <button id="btn-probar-voz" type="button" class="shrink-0 inline-flex items-center gap-1.5 px-3 py-2 rounded-lg bg-surface-container-high hover:bg-surface-container-highest text-on-surface-variant hover:text-primary font-sans text-label-md transition-all active:scale-95">
          <span translate="no" class="material-symbols-outlined text-[18px]">volume_up</span> Probar

      <span class="font-sans text-label-md text-on-surface-variant shrink-0">Tema de lectura</span>

        <button data-rt="oscuro" class="opt-rt px-4 py-1.5 rounded font-sans text-label-md transition-all" type="button">Oscuro</button>
        <button data-rt="sepia" class="opt-rt px-4 py-1.5 rounded font-sans text-label-md transition-all" type="button">Sepia</button>
        <button data-rt="claro" class="opt-rt px-4 py-1.5 rounded font-sans text-label-md transition-all" type="button">Claro</button>
      </div>
    </div>
  </div>
</div>

<!-- Lectura -->
<!-- Lector en voz alta -->
<div id="tts" role="toolbar" aria-label="Lectura en voz alta">
  <button id="tts-back" type="button" aria-label="Atrás 5 segundos"><span translate="no" class="material-symbols-outlined text-[22px]">replay_5</span></button>
  <button id="tts-play" type="button" aria-label="Escuchar"><span translate="no" class="material-symbols-outlined text-[24px]" id="tts-icon">play_arrow</span></button>
  <button id="tts-fwd" type="button" aria-label="Adelante 5 segundos"><span translate="no" class="material-symbols-outlined text-[22px]">forward_5</span></button>
  <span id="tts-pos"></span>
  <button id="tts-rate" type="button" class="chip" aria-label="Velocidad" aria-haspopup="menu">1x</button>
  <button id="tts-close" type="button" aria-label="Cerrar el lector"><span translate="no" class="material-symbols-outlined text-[20px]">close</span></button>
</div>
<div id="tts-menu" role="menu" aria-label="Velocidad de lectura"></div>

<!-- Burbuja del subrayador: aparece sobre la selección -->
<div id="burbuja" role="toolbar" aria-label="Acciones sobre la selección">
  <button type="button" data-act="subrayar"><span translate="no" class="material-symbols-outlined text-[17px] text-primary">format_ink_highlighter</span> Subrayar</button>
  <span class="sep"></span>
  <button type="button" data-act="preguntar"><span translate="no" class="material-symbols-outlined text-[17px] text-secondary">help</span> Preguntar</button>
  <span class="sep"></span>
  <button type="button" data-act="copiar" aria-label="Copiar la cita"><span translate="no" class="material-symbols-outlined text-[17px]">content_copy</span></button>
</div>

<main id="reader" class="min-h-screen pt-16">
  <div class="mx-auto px-gutter-mobile md:px-gutter-tablet py-stack-gap-xl" id="reader-inner" style="max-width:760px">

    <div id="loading" class="flex items-center justify-center gap-2 py-24 rd-muted">
      <span translate="no" class="material-symbols-outlined animate-spin">progress_activity</span> Cargando capítulo…
    </div>

    <article id="chapter-wrap" class="hidden">
      <p class="font-sans text-label-sm rd-muted uppercase tracking-[0.2em] mb-2" id="chapter-kicker"></p>
      <h1 translate="yes" class="font-serif text-headline-xl md:text-display-hero mb-element-gap-lg" id="chapter-title"></h1>
      <div class="w-16 border-t rd-rule mb-stack-gap-xl"></div>
      <div translate="yes" id="chapter-body" style="font-size:18px;line-height:1.8"></div>

      <!-- Compositor: se abre bajo el texto con la cita ya puesta -->
      <div id="composer" class="hidden mt-stack-gap-xl rounded-xl bg-surface-container-low border border-secondary-container/30 p-card-padding-sm font-sans">
        <p class="font-sans text-label-sm text-secondary uppercase tracking-widest flex items-center gap-1.5 mb-element-gap-sm">
          <span translate="no" class="material-symbols-outlined text-[16px]">help</span> <span id="composer-titulo">Nueva pregunta</span>
        </p>
        <blockquote id="composer-cita" class="border-l-2 border-secondary-container pl-3 py-0.5 text-body-sm text-on-surface-variant italic mb-element-gap-md max-h-24 overflow-hidden"></blockquote>
        <textarea id="composer-texto" rows="3" maxlength="500" placeholder="¿Qué quieres preguntar sobre este fragmento?"
          class="w-full rounded-lg bg-surface-container-lowest border border-surface-container-highest px-4 py-3 text-body-md text-on-surface placeholder:text-outline/60 outline-none focus:border-secondary-container resize-y"></textarea>
        <div class="flex items-center gap-element-gap-md flex-wrap mt-element-gap-md">
          <p id="composer-aviso" class="text-label-sm text-outline flex items-center gap-1.5 min-w-0"></p>
          <div class="flex gap-element-gap-sm ml-auto">
            <button id="composer-cancelar" type="button" class="px-4 py-2.5 rounded-lg bg-surface-container-high hover:bg-surface-container-highest text-on-surface text-label-md transition-all active:scale-95">Cancelar</button>
            <button id="composer-enviar" type="button" class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-lg bg-secondary-container hover:bg-secondary-fixed-dim text-on-secondary-container text-label-md font-bold transition-all active:scale-95">
              <span translate="no" class="material-symbols-outlined text-[18px]">send</span> Publicar
            </button>
          </div>
        </div>
      </div>

      <!-- Aviso de preguntas tapadas de este capítulo -->
      <a id="tapadas" href="/duelos" class="hidden items-center gap-2 mt-element-gap-lg rounded-lg bg-surface-container-low px-4 py-3 font-sans text-body-sm text-on-surface-variant hover:bg-surface-container transition-colors">
        <span translate="no" class="material-symbols-outlined text-[18px] text-error">lock</span>
        <span id="tapadas-texto"></span>
      </a>
    </article>

    <div id="error-box" class="hidden flex-col items-center text-center gap-element-gap-md py-24">
      <span translate="no" class="material-symbols-outlined text-error text-[40px]">error</span>
      <p class="font-sans text-body-md rd-muted" id="error-msg"></p>
      <a id="error-back" href="/duelos" class="font-sans text-label-md text-primary hover:underline">← Volver al duelo</a>
    </div>

    <!-- Navegación inferior -->
    <nav id="nav-bottom" class="hidden mt-stack-gap-xl pt-element-gap-lg border-t rd-rule flex-col gap-element-gap-md">
      <p class="font-sans text-body-sm rd-muted text-center" id="mark-hint"></p>
      <div class="flex items-center gap-element-gap-md">
        <button id="btn-prev" class="shrink-0 inline-flex items-center gap-1.5 px-4 py-3 rounded-lg bg-surface-container-high hover:bg-surface-container-highest text-on-surface font-sans text-label-md transition-all active:scale-95 disabled:opacity-30 disabled:pointer-events-none" type="button">
          <span translate="no" class="material-symbols-outlined text-[18px]">chevron_left</span><span class="hidden sm:inline">Anterior</span>
        </button>
        <a id="btn-duel" href="/duelos" class="flex-1 text-center px-4 py-3 rounded-lg bg-surface-container-high hover:bg-surface-container-highest text-on-surface-variant font-sans text-label-md transition-all">
          Ver duelo
        </a>
        <button id="btn-next" class="shrink-0 inline-flex items-center gap-1.5 px-5 py-3 rounded-lg bg-primary-container hover:bg-tertiary-fixed-dim text-on-primary-container font-sans text-label-md font-bold shadow-lg shadow-primary-container/25 transition-all active:scale-95 disabled:opacity-30 disabled:pointer-events-none" type="button">
          <span class="hidden sm:inline">Siguiente</span><span translate="no" class="material-symbols-outlined text-[18px]">chevron_right</span>
        </button>
      </div>
    </nav>
  </div>
</main>

<script src="/js/app.js"></script>
<script>
const params = new URLSearchParams(location.search);
const duelId = params.get('duelo');
let current = parseInt(params.get('cap'), 10) || 1;
let duelInfo = null;

/* ---------- Preferencias de lectura ---------- */
const PREFS_KEY = 'readerPrefs';
const defaults = { font: 'serif', size: 18, lh: '1.8', w: '760', rt: 'oscuro', vel: 1, voz: '', wpmVoz: 0 };
let prefs = { ...defaults };
try { prefs = { ...defaults, ...JSON.parse(localStorage.getItem(PREFS_KEY) || '{}') }; } catch {}

function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch {} }

function applyPrefs() {
  const body = document.getElementById('chapter-body');
  body.classList.toggle('sans', prefs.font === 'sans');
  body.style.fontSize = prefs.size + 'px';
  body.style.lineHeight = prefs.lh;
  document.getElementById('reader-inner').style.maxWidth = prefs.w + 'px';
  document.getElementById('reader').dataset.rt = prefs.rt;
  document.getElementById('size-label').textContent = prefs.size + 'px';

  const on = 'bg-surface-container-highest text-primary font-bold';
  const mark = (sel, attr, val) =>
    document.querySelectorAll(sel).forEach((b) => {
      const active = b.dataset[attr] === String(val);
      b.classList.toggle('bg-surface-container-highest', active);
      b.classList.toggle('text-primary', active);
      b.classList.toggle('font-bold', active);
      b.classList.toggle('text-on-surface-variant', !active);
    });
  mark('.opt-font', 'font', prefs.font);
  mark('.opt-lh', 'lh', prefs.lh);
  mark('.opt-w', 'w', prefs.w);
  mark('.opt-rt', 'rt', prefs.rt);
  savePrefs();
  if (typeof remedirYActualizar === 'function') setTimeout(remedirYActualizar, 0);
}

document.getElementById('btn-settings').addEventListener('click', () =>
  document.getElementById('settings').classList.toggle('hidden')
);
document.querySelectorAll('.opt-font').forEach((b) => b.addEventListener('click', () => { prefs.font = b.dataset.font; applyPrefs(); }));
document.querySelectorAll('.opt-lh').forEach((b) => b.addEventListener('click', () => { prefs.lh = b.dataset.lh; applyPrefs(); }));
document.querySelectorAll('.opt-w').forEach((b) => b.addEventListener('click', () => { prefs.w = b.dataset.w; applyPrefs(); }));
document.querySelectorAll('.opt-rt').forEach((b) => b.addEventListener('click', () => { prefs.rt = b.dataset.rt; applyPrefs(); }));
document.getElementById('size-minus').addEventListener('click', () => { prefs.size = Math.max(14, prefs.size - 1); applyPrefs(); });
document.getElementById('size-plus').addEventListener('click', () => { prefs.size = Math.min(28, prefs.size + 1); applyPrefs(); });

/* ---------- Carga de capítulos ---------- */
let PARRAFOS = []; // texto plano de cada párrafo, tal y como se guardan las citas
function renderBody(text) {
  const body = document.getElementById('chapter-body');
  body.replaceChildren();
  // La fuente mete caracteres invisibles (marcas de agua de ancho cero) entre
  // las letras. No se ven, pero ensucian las citas, el conteo de palabras y
  // hacen tropezar a la voz que lee, así que se quitan al pintar.
  PARRAFOS = String(text)
    .replace(/[​-‏⁠﻿]/g, '')
    .split(/\n+/)
    .map((s) => s.trim())
    .filter(Boolean);
  PARRAFOS.forEach((par, i) => {
    const p = document.createElement('p');
    p.dataset.i = i;
    p.textContent = par; // texto plano: nada de HTML de la fuente
    body.appendChild(p);
  });
}

/* ---------- Subrayados y preguntas sobre el texto ----------
   Una marca se guarda como la cita más el párrafo y el desplazamiento donde
   empieza. Al volver se busca primero en esa posición y, si la fuente cambió
   algo, por el texto de la cita; si ya no aparece, la marca simplemente no se
   pinta y la pregunta sigue viva en su pantalla. */
let SUBRAYADOS = [];
let PREGUNTAS = [];
let CONTEXTO = { rival: null, rivalRead: null, myRead: 0, tapadas: 0 };
let seleccion = null; // { paraIndex, start, end, cita }

function posicionDe(texto, cita, offset) {
  if (!cita) return null;
  if (Number.isInteger(offset)) {
    if (texto.substr(offset, cita.length) === cita) return offset;
    const cerca = texto.indexOf(cita, Math.max(0, offset - 120));
    if (cerca >= 0) return cerca;
  }
  const i = texto.indexOf(cita);
  return i >= 0 ? i : null;
}

// Resuelve una marca a { paraIndex, start, end } sobre el texto ya pintado.
function ubicar(marca) {
  const i = Number.isInteger(marca.paraIndex) ? marca.paraIndex : -1;
  if (i >= 0 && i < PARRAFOS.length) {
    const pos = posicionDe(PARRAFOS[i], marca.quote, marca.charOffset);
    if (pos !== null) return { paraIndex: i, start: pos, end: pos + marca.quote.length };
  }
  for (let j = 0; j < PARRAFOS.length; j++) {
    const pos = posicionDe(PARRAFOS[j], marca.quote, null);
    if (pos !== null) return { paraIndex: j, start: pos, end: pos + marca.quote.length };
  }
  return null;
}

function pintarMarcas(remedir) {
  const body = document.getElementById('chapter-body');
  const porParrafo = new Map();
  const añadir = (marca, tipo) => {
    if (!marca.quote) return;
    const u = ubicar(marca);
    if (!u) return;
    if (!porParrafo.has(u.paraIndex)) porParrafo.set(u.paraIndex, []);
    porParrafo.get(u.paraIndex).push({ ...u, tipo, id: marca.id });
  };
  SUBRAYADOS.forEach((h) => añadir(h, 'hl'));
  PREGUNTAS.filter((q) => !q.hidden).forEach((q) => añadir(q, 'q'));

  // La frase que va diciendo la voz se pinta por debajo de todo: se parte
  // alrededor de las marcas que ya hay para no taparles el color.
  if (LEYENDO) {
    const yaHay = (porParrafo.get(LEYENDO.p) || []).slice().sort((a, b) => a.start - b.start);
    const trozos = [];
    let c = LEYENDO.start;
    for (const m of yaHay) {
      if (m.end <= c || m.start >= LEYENDO.end) continue;
      if (m.start > c) trozos.push([c, Math.min(m.start, LEYENDO.end)]);
      c = Math.max(c, m.end);
    }
    if (c < LEYENDO.end) trozos.push([c, LEYENDO.end]);
    if (!porParrafo.has(LEYENDO.p)) porParrafo.set(LEYENDO.p, []);
    trozos.forEach(([a, b], k) => {
      if (b > a) porParrafo.get(LEYENDO.p).push({ paraIndex: LEYENDO.p, start: a, end: b, tipo: 'tts', id: 'tts' + k });
    });
  }

  body.querySelectorAll('p[data-i]').forEach((p) => {
    const i = parseInt(p.dataset.i, 10);
    const texto = PARRAFOS[i];
    const marcas = (porParrafo.get(i) || []).sort((a, b) => a.start - b.start || b.end - a.end);
    if (!marcas.length) {
      if (p.childNodes.length !== 1 || p.firstChild.nodeType !== 3) p.textContent = texto;
      return;
    }
    p.replaceChildren();
    let cursor = 0;
    for (const m of marcas) {
      if (m.start < cursor) continue; // solapadas: gana la primera
      if (m.start > cursor) p.appendChild(document.createTextNode(texto.slice(cursor, m.start)));
      const mk = document.createElement('mark');
      mk.className = { q: 'marca-q', hl: 'marca-hl', tts: 'marca-tts' }[m.tipo];
      mk.dataset.tipo = m.tipo;
      mk.dataset.id = m.id;
      if (m.tipo === 'q') mk.id = 'q' + m.id;
      mk.textContent = texto.slice(m.start, m.end);
      p.appendChild(mk);
      cursor = m.end;
    }
    if (cursor < texto.length) p.appendChild(document.createTextNode(texto.slice(cursor)));
  });

  // Contador de la barra y aviso de las que llegan tapadas.
  const cuenta = document.getElementById('q-count');
  const visibles = PREGUNTAS.length;
  cuenta.textContent = visibles;
  cuenta.classList.toggle('hidden', visibles === 0);

  const aviso = document.getElementById('tapadas');
  const n = PREGUNTAS.filter((q) => q.hidden).length;
  aviso.classList.toggle('hidden', n === 0);
  aviso.classList.toggle('flex', n > 0);
  if (n > 0) {
    document.getElementById('tapadas-texto').textContent =
      `${n} pregunta${n === 1 ? '' : 's'} de este capítulo te llega${n === 1 ? '' : 'n'} tapada${n === 1 ? '' : 's'}: vas por el capítulo ${CONTEXTO.myRead}. Ábrela${n === 1 ? '' : 's'} en la pantalla de preguntas.`;
  }
  // Al repintar solo la frase que se está leyendo no hace falta volver a medir.
  if (remedir !== false) setTimeout(remedirYActualizar, 0);
}

async function cargarMarcas(n) {
  try {
    const [subs, pregs] = await Promise.all([
      api(`/api/duels/${duelId}/highlights?chapter=${n}`),
      api(`/api/duels/${duelId}/questions?chapter=${n}`),
    ]);
    SUBRAYADOS = subs.highlights;
    PREGUNTAS = pregs.questions;
    CONTEXTO = { rival: pregs.rival, rivalRead: pregs.rivalRead, myRead: pregs.me.chaptersRead };
    pintarMarcas();
    irAlAncla();
  } catch {} // sin marcas se lee igual
}

// Al llegar desde la pantalla de preguntas con #q<id> se resalta ese fragmento.
function irAlAncla() {
  if (!location.hash.startsWith('#q')) return;
  const el = document.getElementById(location.hash.slice(1));
  if (!el) return;
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  el.classList.add('resaltada');
}

/* ---------- Selección ---------- */
function parrafoDe(nodo) {
  const el = nodo && (nodo.nodeType === 1 ? nodo : nodo.parentElement);
  return el ? el.closest('#chapter-body p[data-i]') : null;
}

// Desplazamiento de un punto del DOM dentro del texto plano del párrafo. Se
// recorren los nodos de texto porque las marcas ya pintadas lo trocean.
function offsetEn(p, nodo, off) {
  let total = 0;
  const w = document.createTreeWalker(p, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) {
    if (n === nodo) return total + off;
    total += n.nodeValue.length;
  }
  return null;
}

const MAX_CITA = 300;

function leerSeleccion() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) return null;
  const r = sel.getRangeAt(0);
  const p = parrafoDe(r.startContainer);
  if (!p) return null;
  const i = parseInt(p.dataset.i, 10);
  const texto = PARRAFOS[i];
  let start = offsetEn(p, r.startContainer, r.startOffset);
  // Si la selección cruza párrafos se queda con el primero: la cita que se
  // guarda es justo la que se ve en el compositor, sin sorpresas.
  const mismo = parrafoDe(r.endContainer) === p;
  let end = mismo ? offsetEn(p, r.endContainer, r.endOffset) : texto.length;
  if (start === null || end === null || end <= start) return null;
  while (start < end && /\s/.test(texto[start])) start++;
  while (end > start && /\s/.test(texto[end - 1])) end--;
  if (end - start > MAX_CITA) end = start + MAX_CITA;
  const cita = texto.slice(start, end);
  if (!cita.trim()) return null;
  return { paraIndex: i, start, end, cita, rect: r.getBoundingClientRect() };
}

function colocarBurbuja(rect) {
  const b = document.getElementById('burbuja');
  b.classList.add('ver');
  const ancho = b.offsetWidth;
  const alto = b.offsetHeight;
  let x = rect.left + rect.width / 2 - ancho / 2;
  x = Math.max(8, Math.min(x, window.innerWidth - ancho - 8));
  let y = rect.top - alto - 10;
  if (y < 70) y = rect.bottom + 10; // debajo si arriba está la barra
  b.style.left = Math.round(x) + 'px';
  b.style.top = Math.round(y) + 'px';
}

function ocultarBurbuja() {
  document.getElementById('burbuja').classList.remove('ver');
}

function revisarSeleccion() {
  const s = leerSeleccion();
  if (!s) { ocultarBurbuja(); seleccion = null; return; }
  seleccion = s;
  colocarBurbuja(s.rect);
}

['mouseup', 'touchend', 'keyup'].forEach((ev) =>
  document.getElementById('chapter-body').addEventListener(ev, () => setTimeout(revisarSeleccion, 0))
);
document.addEventListener('mousedown', (e) => {
  if (!document.getElementById('burbuja').contains(e.target)) ocultarBurbuja();
});
window.addEventListener('scroll', ocultarBurbuja, { passive: true });

/* ---------- Acciones de la burbuja ---------- */
async function subrayar() {
  if (!seleccion) return;
  try {
    const { highlight } = await api(`/api/duels/${duelId}/highlights`, {
      method: 'POST',
      body: { chapter: current, quote: seleccion.cita, paraIndex: seleccion.paraIndex, charOffset: seleccion.start },
    });
    SUBRAYADOS.push(highlight);
    window.getSelection().removeAllRanges();
    pintarMarcas();
  } catch (err) { toast(err.message); }
}

function abrirCompositor() {
  if (!seleccion) return;
  const c = document.getElementById('composer');
  document.getElementById('composer-cita').textContent = seleccion.cita;
  const aviso = document.getElementById('composer-aviso');
  if (CONTEXTO.rival && CONTEXTO.rivalRead !== null) {
    const nombre = CONTEXTO.rival.displayName.split(' ')[0];
    const tapa = current > CONTEXTO.rivalRead;
    aviso.innerHTML = tapa
      ? `<span translate="no" class="material-symbols-outlined text-[15px] text-error">lock</span> ${esc(nombre)} va por el cap. ${CONTEXTO.rivalRead}: le llegará tapada como spoiler.`
      : `<span translate="no" class="material-symbols-outlined text-[15px] text-secondary">visibility</span> ${esc(nombre)} ya pasó este capítulo: la verá completa.`;
  } else {
    aviso.textContent = 'Todavía no hay rival en el duelo.';
  }
  c.classList.remove('hidden');
  const t = document.getElementById('composer-texto');
  t.value = '';
  c.scrollIntoView({ block: 'center', behavior: 'smooth' });
  t.focus();
}

async function publicarPregunta() {
  const texto = document.getElementById('composer-texto').value.trim();
  if (!texto) { document.getElementById('composer-texto').focus(); return; }
  if (!seleccion) return;
  try {
    const { question } = await api(`/api/duels/${duelId}/questions`, {
      method: 'POST',
      body: {
        chapter: current,
        text: texto,
        quote: seleccion.cita,
        paraIndex: seleccion.paraIndex,
        charOffset: seleccion.start,
      },
    });
    PREGUNTAS.unshift(question);
    document.getElementById('composer').classList.add('hidden');
    window.getSelection().removeAllRanges();
    pintarMarcas();
    toast(question.spoilerForRival ? 'Pregunta publicada — a tu rival le llega tapada' : 'Pregunta publicada', 'ok');
  } catch (err) { toast(err.message); }
}

document.getElementById('burbuja').addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  if (!b || !seleccion) return;
  const act = b.dataset.act;
  ocultarBurbuja();
  if (act === 'subrayar') subrayar();
  else if (act === 'preguntar') abrirCompositor();
  else if (act === 'copiar') {
    try { await navigator.clipboard.writeText(seleccion.cita); toast('Cita copiada', 'ok'); }
    catch { toast('No se pudo copiar'); }
  }
});
document.getElementById('composer-cancelar').addEventListener('click', () =>
  document.getElementById('composer').classList.add('hidden')
);
document.getElementById('composer-enviar').addEventListener('click', publicarPregunta);

/* ---------- Lectura en voz alta ----------
   Usa la voz que ya trae el navegador (Web Speech API): sin servicio externo,
   sin clave y sin coste. El idioma no sale del texto guardado sino de la voz
   elegida, así que se prefiere una en español y se recuerda cuál.
   Ojo con los saltos: la voz no es un archivo de audio, no hay "ir al segundo
   30". El capítulo se parte en frases y los 5 segundos se traducen a palabras
   al ritmo actual, así que el salto cae en la frase más cercana. */
const VELOCIDADES = [0.75, 1, 1.25, 1.5, 2, 2.5, 3, 4];
const WPM_POR_DEFECTO = 175; // ritmo de una voz sintética a 1x, hasta medir el real
const soporteVoz = typeof speechSynthesis !== 'undefined';

/* Ritmo real de la voz. En vez de estimar con un número de manual, se cronometra
   lo que tarda en decir cada frase y se normaliza a 1x, así el tiempo que se
   muestra es el de tu voz a tu velocidad. Se guarda y se reinicia al cambiar de
   voz, porque cada una lee a su aire. */
let medidoPalabras = 0;
let medidoMinutos = 0;

function wpmVoz() {
  if (medidoMinutos > 0 && medidoPalabras >= 60) return medidoPalabras / medidoMinutos;
  const guardado = parseFloat(prefs.wpmVoz);
  return Number.isFinite(guardado) && guardado > 40 ? guardado : WPM_POR_DEFECTO;
}

function anotarMedida(palabras, ms, vel) {
  if (!(palabras > 0) || !(ms > 400)) return;
  medidoPalabras += palabras;
  medidoMinutos += (ms / 60000) * vel;
  if (medidoPalabras >= 60) {
    prefs.wpmVoz = Math.round(medidoPalabras / medidoMinutos);
    savePrefs();
  }
}

function olvidarMedida() {
  medidoPalabras = 0;
  medidoMinutos = 0;
  prefs.wpmVoz = 0;
  savePrefs();
}

function palabrasDesde(i) {
  let n = 0;
  for (let k = Math.max(0, i); k < PIEZAS.length; k++) n += PIEZAS[k].palabras;
  return n;
}

function minutosDe(palabras, vel) {
  return palabras / (wpmVoz() * vel);
}

function textoDuracion(min) {
  if (!Number.isFinite(min) || min <= 0) return '';
  if (min < 1) return Math.max(5, Math.round((min * 60) / 5) * 5) + ' s';
  if (min < 60) return Math.round(min) + ' min';
  const h = Math.floor(min / 60);
  const m = Math.round(min % 60);
  return h + ' h' + (m ? ' ' + m + ' min' : '');
}

const num = (v) => String(v).replace('.', ',');

let PIEZAS = [];
let LEYENDO = null;
let iPieza = 0;
let hablando = false; // sesión de escucha abierta
let pausado = false;  // abierta pero callada
let generacion = 0;   // corta el encadenado de la frase anterior
let VOCES = [];

function trocearCapitulo() {
  PIEZAS = [];
  PARRAFOS.forEach((texto, p) => {
    const rx = /[^.!?…]+(?:[.!?…]+["»”']?)?/g;
    let m;
    while ((m = rx.exec(texto))) {
      let start = m.index;
      let end = start + m[0].length;
      while (start < end && /\s/.test(texto[start])) start++;
      while (end > start && /\s/.test(texto[end - 1])) end--;
      if (end <= start) continue;
      const t = texto.slice(start, end);
      PIEZAS.push({ p, start, end, texto: t, palabras: (t.match(/\S+/g) || []).length });
    }
  });
  iPieza = 0;
}

function vocesEspanol() {
  return VOCES.filter((v) => /^es/i.test(v.lang));
}

function vozElegida() {
  const guardada = VOCES.find((v) => v.name === prefs.voz);
  if (guardada) return guardada;
  const es = vocesEspanol();
  // Sin elección previa: español de México, cualquier español, y si no hay, lo que haya.
  return es.find((v) => /^es-MX/i.test(v.lang)) || es[0] || VOCES[0] || null;
}

/* Los nombres que da el sistema son impronunciables ("Microsoft Dalia Online
   (Natural) - Spanish (Mexico)"). Se dejan en el nombre propio y se agrupan por
   país, que es lo que de verdad se elige: el acento. */
const NOMBRES = (tipo) => {
  try { return new Intl.DisplayNames(['es'], { type: tipo }); } catch { return null; }
};
const REGIONES = NOMBRES('region');
const IDIOMAS = NOMBRES('language');

function etiquetaIdioma(lang) {
  const [idioma, region] = String(lang || '').split('-');
  let txt = idioma;
  try { if (IDIOMAS) txt = IDIOMAS.of(idioma) || idioma; } catch {}
  if (region) {
    try { if (REGIONES) txt += ' · ' + REGIONES.of(region.toUpperCase()); } catch {}
  }
  return txt.charAt(0).toUpperCase() + txt.slice(1);
}

function nombreCorto(v) {
  const limpio = v.name
    .split(' - ')[0]
    .replace(/Microsoft|Google|Online|\(Natural\)|español|Spanish/gi, '')
    .replace(/\s+/g, ' ')
    .trim();
  return limpio || v.name;
}

function cargarVoces() {
  if (!soporteVoz) return;
  VOCES = speechSynthesis.getVoices() || [];
  const sel = document.getElementById('sel-voz');
  const fila = document.getElementById('fila-voz');
  if (!VOCES.length) { fila.classList.add('hidden'); return; }
  fila.classList.remove('hidden');

  // Todas las voces del aparato, las de español primero y por acento.
  const grupos = new Map();
  const meter = (v) => {
    const k = etiquetaIdioma(v.lang);
    if (!grupos.has(k)) grupos.set(k, []);
    grupos.get(k).push(v);
  };
  vocesEspanol().forEach(meter);
  VOCES.filter((v) => !/^es/i.test(v.lang)).forEach(meter);

  const opcion = (v) =>
    `<option value="${esc(v.name)}">${esc(nombreCorto(v))}${v.localService ? ' · sin internet' : ''}</option>`;
  sel.innerHTML = [...grupos]
    .map(([k, vs]) => `<optgroup label="${esc(k)}">${vs.map(opcion).join('')}</optgroup>`)
    .join('');
  const actual = vozElegida();
  if (actual) sel.value = actual.name;
  document.getElementById('cuenta-voces').textContent =
    `${VOCES.length} voces · ${vocesEspanol().length} en español`;
}

/* Una frase de muestra para elegir de oído sin tener que empezar el capítulo. */
function probarVoz() {
  if (!soporteVoz) return;
  if (hablando && !pausado) { pausado = true; generacion++; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance('Así suena esta voz. Buena lectura.');
  const v = vozElegida();
  if (v) { u.voice = v; u.lang = v.lang; }
  u.rate = prefs.vel;
  setTimeout(() => speechSynthesis.speak(u), 0);
  actualizarBarra();
}

function actualizarBarra() {
  document.getElementById('tts-icon').textContent = hablando && !pausado ? 'pause' : 'play_arrow';
  document.getElementById('tts-rate').textContent = num(prefs.vel) + 'x';
  const pos = document.getElementById('tts-pos');
  if (!PIEZAS.length) { pos.textContent = ''; return; }
  // Antes de empezar, lo que dura el capítulo entero; ya en marcha, lo que falta.
  const palabras = hablando ? palabrasDesde(iPieza) : palabrasDesde(0);
  pos.textContent = (hablando ? 'quedan ~' : '~') + textoDuracion(minutosDe(palabras, prefs.vel));
  pos.title = `Frase ${Math.min(iPieza + 1, PIEZAS.length)} de ${PIEZAS.length}`;
}

/* Menú de velocidades: cada una dice lo que tardaría el capítulo a ese ritmo. */
function alternarMenuVel() {
  const m = document.getElementById('tts-menu');
  if (m.classList.contains('ver')) { m.classList.remove('ver'); return; }
  const total = palabrasDesde(0);
  m.innerHTML = VELOCIDADES.map(
    (v) => `<button type="button" data-vel="${v}" class="${v === prefs.vel ? 'activo' : ''}">
      <span>${num(v)}x</span><span class="dur">${esc(textoDuracion(minutosDe(total, v)))}</span>
    </button>`
  ).join('');
  m.classList.add('ver');
}

function resaltarPieza(i) {
  const pz = PIEZAS[i];
  LEYENDO = pz ? { p: pz.p, start: pz.start, end: pz.end } : null;
  pintarMarcas(false);
  if (!pz) return;
  const mk = document.querySelector('#chapter-body mark.marca-tts');
  if (mk) {
    const r = mk.getBoundingClientRect();
    if (r.top < 90 || r.bottom > window.innerHeight - 120) mk.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  marcarActividad(); // escuchar también es leer: que siga contando el tiempo
}

function hablarPieza(i) {
  if (!soporteVoz || !PIEZAS.length) return;
  if (i < 0) i = 0;
  if (i >= PIEZAS.length) {
    pararVoz();
    iPieza = 0; // al volver a darle, empieza de nuevo el capítulo
    actualizarBarra();
    toast('Fin del capítulo', 'ok');
    return;
  }
  generacion++;
  const mio = generacion;
  iPieza = i;
  speechSynthesis.cancel();

  const u = new SpeechSynthesisUtterance(PIEZAS[i].texto);
  const v = vozElegida();
  if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'es-MX'; }
  u.rate = prefs.vel;
  const t0 = performance.now();
  u.onend = () => {
    if (mio !== generacion) return;
    anotarMedida(PIEZAS[i].palabras, performance.now() - t0, u.rate);
    if (hablando && !pausado) hablarPieza(iPieza + 1);
    else actualizarBarra();
  };
  u.onerror = (e) => {
    if (mio !== generacion || e.error === 'interrupted' || e.error === 'canceled') return;
    hablando = false;
    actualizarBarra();
    toast(e.error === 'network' ? 'Esa voz necesita internet' : 'La voz se detuvo');
  };

  hablando = true;
  pausado = false;
  resaltarPieza(i);
  actualizarBarra();
  // Tras cancel(), Chrome necesita un respiro antes de aceptar la siguiente.
  setTimeout(() => { if (mio === generacion) speechSynthesis.speak(u); }, 0);
}

function pararVoz() {
  if (!soporteVoz) return;
  generacion++;
  speechSynthesis.cancel();
  hablando = false;
  pausado = false;
  LEYENDO = null;
  pintarMarcas(false);
  actualizarBarra();
}

/* Pausar cancela y al seguir se repite la frase desde el principio: pause() no
   es fiable en todas las voces, y repetir una frase es mejor que quedarse
   mudo. */
function alternarVoz() {
  if (hablando && !pausado) {
    pausado = true;
    generacion++;
    speechSynthesis.cancel();
    actualizarBarra();
    return;
  }
  hablarPieza(iPieza);
}

function saltar(segundos) {
  if (!PIEZAS.length) return;
  const porSegundo = (wpmVoz() * prefs.vel) / 60;
  let faltan = Math.max(1, Math.round(Math.abs(segundos) * porSegundo));
  const paso = segundos < 0 ? -1 : 1;
  let i = iPieza;
  while (faltan > 0 && i + paso >= 0 && i + paso < PIEZAS.length) {
    i += paso;
    faltan -= PIEZAS[i].palabras;
  }
  const sonaba = hablando && !pausado;
  iPieza = Math.max(0, Math.min(i, PIEZAS.length - 1));
  if (sonaba) hablarPieza(iPieza);
  else { resaltarPieza(iPieza); actualizarBarra(); }
}

function abrirVoz(empezar) {
  if (!soporteVoz) { toast('Tu navegador no puede leer en voz alta'); return; }
  if (!PIEZAS.length) trocearCapitulo();
  document.getElementById('tts').classList.add('ver');
  document.body.classList.add('con-voz');
  if (!VOCES.length) cargarVoces();
  if (!vocesEspanol().length) toast('Tu navegador no tiene voces en español instaladas');
  actualizarBarra();
  if (empezar) alternarVoz();
}

if (soporteVoz) {
  cargarVoces();
  speechSynthesis.onvoiceschanged = cargarVoces;
  document.getElementById('btn-voz').addEventListener('click', () => {
    const barra = document.getElementById('tts');
    if (barra.classList.contains('ver')) { pararVoz(); barra.classList.remove('ver'); document.body.classList.remove('con-voz'); document.getElementById('tts-menu').classList.remove('ver'); }
    else abrirVoz(true);
  });
  document.getElementById('tts-play').addEventListener('click', alternarVoz);
  document.getElementById('tts-back').addEventListener('click', () => saltar(-5));
  document.getElementById('tts-fwd').addEventListener('click', () => saltar(5));
  document.getElementById('tts-close').addEventListener('click', () => {
    pararVoz();
    document.getElementById('tts').classList.remove('ver');
    document.body.classList.remove('con-voz');
  });
  document.getElementById('tts-rate').addEventListener('click', alternarMenuVel);
  document.getElementById('tts-menu').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-vel]');
    if (!b) return;
    prefs.vel = parseFloat(b.dataset.vel);
    savePrefs();
    document.getElementById('tts-menu').classList.remove('ver');
    actualizarBarra();
    if (hablando && !pausado) hablarPieza(iPieza); // el ritmo solo cambia lo que empieza
  });
  document.addEventListener('click', (e) => {
    const m = document.getElementById('tts-menu');
    if (!m.classList.contains('ver')) return;
    if (!m.contains(e.target) && e.target.closest('#tts-rate') === null) m.classList.remove('ver');
  });
  document.getElementById('sel-voz').addEventListener('change', (e) => {
    prefs.voz = e.target.value;
    olvidarMedida(); // cada voz lee a su ritmo: el estimado se vuelve a medir
    savePrefs();
    actualizarBarra();
    if (hablando && !pausado) hablarPieza(iPieza);
    else probarVoz();
  });
  document.getElementById('btn-probar-voz').addEventListener('click', probarVoz);
  // Al salir de la página la voz seguiría hablando sola.
  window.addEventListener('pagehide', () => speechSynthesis.cancel());
} else {
  document.getElementById('btn-voz').classList.add('hidden');
  document.getElementById('fila-voz').classList.add('hidden');
}

/* Tocar una marca: la pregunta se abre en su pantalla, el subrayado se quita. */
document.getElementById('chapter-body').addEventListener('click', async (e) => {
  const mk = e.target.closest('mark[data-tipo]');
  if (!mk || mk.dataset.tipo === 'tts') return;
  if (mk.dataset.tipo === 'q') {
    window.location.href = `/preguntas?duelo=${duelId}#q${mk.dataset.id}`;
    return;
  }
  const ok = await confirmDialog({
    title: '¿Quitar este subrayado?',
    message: mk.textContent.slice(0, 120),
    confirmText: 'Quitar',
  });
  if (!ok) return;
  try {
    await api(`/api/highlights/${mk.dataset.id}`, { method: 'DELETE' });
    SUBRAYADOS = SUBRAYADOS.filter((h) => String(h.id) !== String(mk.dataset.id));
    pintarMarcas();
  } catch (err) { toast(err.message); }
});

/* ---------- Tiempo de lectura real ----------
   Solo se cuenta el tiempo con la pestaña visible y con actividad reciente, así
   que el total subestima antes que inflar: una pestaña abierta toda la noche no
   suma. Se guarda por tramos para no perder la sesión si el navegador muere. */
const TICK_MS = 5000;
const IDLE_MS = 120000; // sin scroll ni toques se deja de contar
const FLUSH_MS = 120000; // cada dos minutos de lectura se manda el tramo
const MIN_ENVIO_MS = 5000; // abrir y cerrar el capítulo no es una lectura

let sesion = { cap: null, activeMs: 0, words: 0, scrollPct: 0, ultimaActividad: 0 };

function marcarActividad() {
  sesion.ultimaActividad = Date.now();
}
['scroll', 'touchstart', 'keydown', 'pointerdown', 'wheel'].forEach((ev) =>
  window.addEventListener(ev, marcarActividad, { passive: true })
);

function enviarSesion(conBeacon) {
  const { cap, activeMs, words, scrollPct } = sesion;
  if (cap === null || activeMs < MIN_ENVIO_MS) return;
  sesion.activeMs = 0; // este tramo ya queda contabilizado
  const cuerpo = { chapter: cap, activeMs, words, scrollPct: Math.round(scrollPct) };
  const url = `/api/duels/${duelId}/reading-session`;
  if (conBeacon && navigator.sendBeacon) {
    // Al ocultar o cerrar la pestaña un fetch normal se cancela; el beacon no.
    try {
      navigator.sendBeacon(url, new Blob([JSON.stringify(cuerpo)], { type: 'application/json' }));
      return;
    } catch {} // sin beacon se intenta igual por fetch
  }
  api(url, { method: 'POST', body: cuerpo }).catch(() => {});
}

function iniciarSesion(numero, texto) {
  enviarSesion(false); // cierra el capítulo anterior
  sesion = {
    cap: numero,
    activeMs: 0,
    words: String(texto || '').split(/\s+/).filter(Boolean).length,
    scrollPct: 0,
    ultimaActividad: Date.now(),
  };
}

let ultimoScrollY = 0;
setInterval(() => {
  if (sesion.cap === null || document.visibilityState !== 'visible') return;
  // No se depende solo del evento de scroll: si la posición cambió, hubo
  // lectura, aunque el navegador no haya emitido el evento. De paso se
  // refresca el avance del capítulo por si el evento tampoco llegó.
  if (window.scrollY !== ultimoScrollY) {
    ultimoScrollY = window.scrollY;
    marcarActividad();
    updateChapterProgress();
  }
  if (Date.now() - sesion.ultimaActividad > IDLE_MS) return;
  sesion.activeMs += TICK_MS;
  if (sesion.activeMs >= FLUSH_MS) enviarSesion(false);
}, TICK_MS);

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') enviarSesion(true);
  else marcarActividad(); // al volver no se cobra el tiempo que estuvo oculta
});
window.addEventListener('pagehide', () => enviarSesion(true));

/* Progreso dentro del capítulo: 0% al empezar, 100% cuando el final del
   artículo llega al borde inferior de la ventana.
   Las medidas del artículo se cachean: sólo cambian al cargar un capítulo,
   al tocar la tipografía o al redimensionar, así el scroll no fuerza layout. */
let artTop = 0;
let artAlto = 0;

function medirArticulo() {
  const art = document.getElementById('chapter-wrap');
  if (!art || art.classList.contains('hidden')) { artAlto = 0; return; }
  const rect = art.getBoundingClientRect();
  artTop = rect.top + window.scrollY;
  artAlto = rect.height;
}

const HEADER_ALTO = 64; // barra superior fija (56px + las dos barras de 4px)

function updateChapterProgress() {
  const bar = document.getElementById('chapter-bar');
  if (!bar || !artAlto) return;
  // 0% con el capítulo sin empezar y 100% cuando su última línea queda a la
  // vista. El recorrido se mide en scroll, no en "cuánto cabe en pantalla",
  // para que abrir un capítulo marque cero y terminarlo marque cien.
  const inicio = Math.max(0, artTop - HEADER_ALTO);
  const fin = artTop + artAlto - window.innerHeight;
  const recorrido = fin - inicio;
  const pct = recorrido <= 0 ? 100 : Math.min(100, Math.max(0, ((window.scrollY - inicio) / recorrido) * 100));
  bar.style.width = pct + '%';
  const lbl = document.getElementById('chapter-pct');
  if (lbl) lbl.textContent = Math.round(pct) + '%';
  if (pct > sesion.scrollPct) sesion.scrollPct = pct; // lo mas lejos que se llego
}

function remedirYActualizar() {
  medirArticulo();
  updateChapterProgress();
}

// Sin requestAnimationFrame a propósito: se pausa con la pestaña en segundo
// plano y dejaría la barra congelada al volver.
window.addEventListener('scroll', updateChapterProgress, { passive: true });
window.addEventListener('resize', remedirYActualizar);

async function loadChapter(n, push = true) {
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('chapter-wrap').classList.add('hidden');
  document.getElementById('nav-bottom').classList.add('hidden');
  document.getElementById('error-box').classList.add('hidden');
  document.getElementById('error-box').classList.remove('flex');
  // Las marcas y las frases del capítulo anterior no valen para este.
  const seguiaLeyendo = hablando && !pausado;
  pararVoz();
  PIEZAS = [];
  document.getElementById('composer').classList.add('hidden');
  document.getElementById('tapadas').classList.add('hidden');
  ocultarBurbuja();
  SUBRAYADOS = [];
  PREGUNTAS = [];
  try {
    const { chapter, duel } = await api(`/api/duels/${duelId}/chapters/${n}`);
    duelInfo = duel;
    current = chapter.number;

    document.getElementById('book-title').textContent = duel.bookTitle;
    iniciarSesion(chapter.number, chapter.body);
    // Minutos estimados con el ritmo del propio lector cuando ya hay medidas
    // suyas; si no, con 240 ppm.
    const minutos = Math.max(1, Math.round(sesion.words / (duel.wpm || 240)));
    document.getElementById('chapter-label').innerHTML =
      `Capítulo ${chapter.number} de ${duel.totalChapters} · <span id="chapter-pct" class="text-secondary font-semibold">0%</span> · ~${minutos} min`;
    document.getElementById('chapter-kicker').textContent = `Capítulo ${chapter.number}`;
    document.getElementById('chapter-title').textContent = chapter.title || `Capítulo ${chapter.number}`;
    renderBody(chapter.body);

    document.getElementById('progress-bar').style.width = Math.round((chapter.number / duel.totalChapters) * 100) + '%';
    document.getElementById('btn-prev').disabled = !chapter.hasPrev;
    const next = document.getElementById('btn-next');
    next.querySelector('span:first-child').textContent = chapter.hasNext ? 'Siguiente' : 'Terminar';

    const hint = document.getElementById('mark-hint');
    if (duel.status === 'waiting') hint.textContent = 'El duelo aún no arranca: se marcará cuando tu rival se una.';
    else if (duel.myRead >= chapter.number) hint.textContent = `Ya tienes registrados ${duel.myRead} capítulos.`;
    else hint.textContent = chapter.hasNext
      ? `Al pasar al capítulo ${chapter.number + 1} se registrará tu lectura hasta el ${chapter.number}.`
      : 'Al terminar se registrará el libro completo.';

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('chapter-wrap').classList.remove('hidden');
    document.getElementById('nav-bottom').classList.remove('hidden');
    document.getElementById('nav-bottom').classList.add('flex');
    applyPrefs();
    window.scrollTo({ top: 0 });
    document.getElementById('chapter-bar').style.width = '0%';
    // Tras pintar: el alto definitivo depende de la tipografía ya aplicada.
    setTimeout(remedirYActualizar, 0);
    cargarMarcas(chapter.number); // subrayados y preguntas, sin frenar la lectura

    // Si estabas escuchando, la voz sigue con el capítulo nuevo.
    if (document.getElementById('tts').classList.contains('ver')) {
      trocearCapitulo();
      if (seguiaLeyendo) hablarPieza(0);
      else actualizarBarra();
    }
    if (push) history.pushState({ n: chapter.number }, '', `/leer?duelo=${duelId}&cap=${chapter.number}`);
    document.title = `Cap. ${chapter.number} — ${duel.bookTitle}`;
  } catch (err) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('error-msg').textContent = err.message;
    const box = document.getElementById('error-box');
    box.classList.remove('hidden');
    box.classList.add('flex');
  }
}

/* Marca la lectura hasta el capítulo dado (silencioso: no interrumpe la lectura) */
async function markUpTo(n) {
  if (!duelInfo || duelInfo.status === 'waiting' || duelInfo.myRead >= n) return;
  try {
    const { duel } = await api(`/api/duels/${duelId}/read-upto`, { method: 'POST', body: { upTo: n } });
    duelInfo.myRead = duel.myStats.chaptersRead;
    if (duel.status === 'finished' && duel.iWon) toast('🏆 ¡Terminaste el libro! Eres el campeón del duelo', 'ok');
    else toast(`Capítulo ${n} registrado ✓`, 'ok');
  } catch (err) { toast(err.message); }
}

document.getElementById('btn-next').addEventListener('click', async () => {
  await markUpTo(current); // al pasar de capítulo, el actual queda leído
  if (current < duelInfo.totalChapters) loadChapter(current + 1);
  else window.location.href = '/duelo?id=' + duelId;
});
document.getElementById('btn-prev').addEventListener('click', () => { if (current > 1) loadChapter(current - 1); });

window.addEventListener('popstate', (e) => {
  const n = (e.state && e.state.n) || parseInt(new URLSearchParams(location.search).get('cap'), 10) || 1;
  loadChapter(n, false);
});

// Flechas del teclado para navegar
document.addEventListener('keydown', (e) => {
  if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight') document.getElementById('btn-next').click();
  if (e.key === 'ArrowLeft') document.getElementById('btn-prev').click();
});

(async () => {
  try { await api('/api/me'); } catch { window.location.href = '/'; return; }
  if (!duelId) { window.location.href = '/duelos'; return; }
  document.getElementById('back-link').href = '/duelo?id=' + duelId;
  document.getElementById('btn-duel').href = '/duelo?id=' + duelId;
  document.getElementById('error-back').href = '/duelo?id=' + duelId;
  document.getElementById('link-preguntas').href = '/preguntas?duelo=' + duelId;
  document.getElementById('tapadas').href = '/preguntas?duelo=' + duelId;
  applyPrefs();
  await loadChapter(current, false);
  history.replaceState({ n: current }, '', `/leer?duelo=${duelId}&cap=${current}`);
})();
</script>
