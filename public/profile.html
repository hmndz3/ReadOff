    <div class="flex items-center justify-center py-24 text-outline gap-2">
      <span translate="no" class="material-symbols-outlined animate-spin">progress_activity</span> Cargando perfil…
    </div>
  </div>

<script src="/js/app.js"></script>
<script>
function metric(label, icon, value, unit, barPct, barNote, accent) {
  return `<div class="rounded-xl bg-surface-container-low p-card-padding-md shadow-lg flex flex-col gap-element-gap-md relative overflow-hidden">
    <div class="flex items-center justify-between">
      <span class="font-sans text-label-md text-on-surface-variant">${label}</span>
      <div class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center"><span translate="no" class="material-symbols-outlined ${accent} text-[22px]">${icon}</span></div>
    </div>
    <div class="flex items-baseline gap-2">
      <span class="font-sans font-extrabold text-[40px] leading-none ${accent}" ${/^\d+$/.test(String(value)) ? `data-contar="${value}"` : ''}>${value}</span>
      <span class="font-sans text-body-sm text-outline">${unit}</span>
    </div>
    <div class="flex flex-col gap-1.5">
      <div class="flex justify-between font-sans text-label-sm text-on-surface-variant"><span>${barNote[0]}</span><span class="font-bold">${barNote[1]}</span></div>
      <div class="w-full h-1.5 rounded-full bg-surface-container-lowest overflow-hidden"><div class="h-full rounded-full ro-bar ${accent === 'text-secondary' ? 'bg-secondary-container' : accent === 'text-error' ? 'bg-error-container' : 'bg-primary-container'}" style="width:${barPct}%"></div></div>
    </div>
  </div>`;
}

/* ---------- Estadísticas de lectura ---------- */

/* Los minutos pueden venir medidos en el lector o estimados por conteo de
   palabras. El ~ distingue lo uno de lo otro: sin él, el dato es medido. */
function aprox(valor, measuredPct) {
  // En cero no hay nada que estimar, así que el ~ sobra.
  const sinDato = parseFloat(String(valor).replace(',', '.')) === 0;
  return (measuredPct >= 100 || sinDato ? '' : '~') + valor;
}

/* Los textos con números se arman por idioma: el diccionario por regex de
   app.js es para cadenas fijas y aquí casi todo lleva cifras dentro. */
const EN = currentLang() === 'en';
const DIAS = EN
  ? ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday']
  : ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
const INICIALES = EN ? ['M', 'T', 'W', 'T', 'F', 'S', 'S'] : ['L', 'M', 'M', 'J', 'V', 'S', 'D'];

/* En español solo sábado y domingo cambian en plural: "los lunes", pero
   "los domingos". */
function diaPlural(i) {
  const d = DIAS[i].toLowerCase();
  return d.endsWith('s') ? d : d + 's';
}

function chipDelta(pct) {
  if (pct === null || pct === undefined)
    return `<span class="font-sans text-label-sm text-outline">${EN ? 'no reference' : 'sin referencia'}</span>`;
  if (pct === 0)
    return `<span class="font-sans text-label-sm text-on-surface-variant">${EN ? 'same as last week' : 'igual que la semana pasada'}</span>`;
  const sube = pct > 0;
  const color = sube ? 'text-primary' : 'text-error';
  return `<span class="inline-flex items-center gap-0.5 font-sans text-label-sm font-bold ${color}">
    <span translate="no" class="material-symbols-outlined text-[16px]">${sube ? 'trending_up' : 'trending_down'}</span>
    ${sube ? '+' : ''}${pct}% ${EN ? 'vs. last week' : 'vs. semana pasada'}</span>`;
}

function tarjetaSemana(label, icon, valor, unidad, pie, accent) {
  return `<div class="rounded-xl bg-surface-container-low p-card-padding-md shadow-lg flex flex-col gap-element-gap-sm">
    <div class="flex items-center justify-between">
      <span class="font-sans text-label-md text-on-surface-variant">${label}</span>
      <span translate="no" class="material-symbols-outlined ${accent} text-[20px]">${icon}</span>
    </div>
    <div class="flex items-baseline gap-1.5 flex-wrap">
      <span class="font-sans font-extrabold text-[28px] sm:text-[36px] leading-none ${accent}">${valor}</span>
      <span class="font-sans text-body-sm text-outline min-w-0">${unidad}</span>
    </div>
    <div class="min-h-[20px]">${pie}</div>
  </div>`;
}

/* Rejilla de actividad: una columna por semana, de lunes a domingo.
   Cuántas semanas caben depende del ancho real, así que el tamaño se calcula al
   montar y en cada resize. Con celdas en fracciones el contenido no cabía en
   pantallas estrechas y la tarjeta lo recortaba sin avisar: aquí se fija el
   píxel exacto de cada celda y se recortan semanas, no columnas a medias. */
const HEAT_GAP = 3;
const HEAT_MIN_CELDA = 12;
const HEAT_ANCHO_ETIQUETAS = 12;
const HEAT_OPACIDAD = [0, 0.2, 0.42, 0.7, 1];

function heatmapHTML() {
  return `<div id="heat-wrap" class="flex gap-1.5 items-start overflow-hidden">
    <div id="heat-dias" class="grid gap-[3px] shrink-0"></div>
    <div id="heat-grid" class="grid gap-[3px] min-w-0"></div>
  </div>`;
}

/* El ancho del contenedor cambia con el giro del móvil, al cargar las fuentes y
   mientras el navegador asienta el layout. Medirlo una sola vez daba un número
   transitorio y la rejilla salía más ancha que su caja, así que se observa. */
let heatUltimoAncho = 0;
function observarHeatmap(h) {
  const wrap = document.getElementById('heat-wrap');
  if (!wrap) return;
  if (typeof ResizeObserver === 'undefined') {
    pintarHeatmap(h);
    return;
  }
  new ResizeObserver(() => {
    if (wrap.clientWidth && wrap.clientWidth !== heatUltimoAncho) pintarHeatmap(h);
  }).observe(wrap);
}

function textoPeriodo(semanas) {
  if (semanas >= 26) return EN ? 'Last 6 months' : 'Últimos 6 meses';
  if (semanas >= 13) return EN ? `Last ${semanas} weeks` : `Últimas ${semanas} semanas`;
  return EN ? `Last ${semanas} weeks` : `Últimas ${semanas} semanas`;
}

function pintarHeatmap(h) {
  const wrap = document.getElementById('heat-wrap');
  const grid = document.getElementById('heat-grid');
  const col = document.getElementById('heat-dias');
  if (!wrap || !grid || !col) return;

  heatUltimoAncho = wrap.clientWidth;
  const disponible = heatUltimoAncho - HEAT_ANCHO_ETIQUETAS - 6;
  if (disponible <= 0) return;
  const caben = Math.floor((disponible + HEAT_GAP) / (HEAT_MIN_CELDA + HEAT_GAP));
  const semanas = Math.max(6, Math.min(h.weeks, caben));
  const celda = Math.floor((disponible - (semanas - 1) * HEAT_GAP) / semanas);

  const nivel = (ch) => {
    if (!ch) return 0;
    const r = ch / Math.max(1, h.max);
    return r > 0.75 ? 4 : r > 0.5 ? 3 : r > 0.25 ? 2 : 1;
  };

  grid.style.gridTemplateColumns = `repeat(${semanas}, ${celda}px)`;
  grid.style.gridTemplateRows = `repeat(7, ${celda}px)`;
  grid.style.gridAutoFlow = 'column';
  grid.innerHTML = h.days
    .slice(-semanas * 7) // se queda con las semanas más recientes
    .map((d) => {
      if (d.future) return `<div class="rounded-[3px]"></div>`;
      const n = nivel(d.chapters);
      const fondo = n === 0 ? 'bg-surface-container-high' : 'bg-primary-container';
      const titulo = `${d.day}: ${d.chapters} cap${d.chapters === 1 ? '' : 's'}${d.minutes ? ' · ' + fmtMinutes(d.minutes) : ''}`;
      return `<div class="rounded-[3px] ${fondo}" style="${n ? 'opacity:' + HEAT_OPACIDAD[n] : ''}" title="${titulo}"></div>`;
    })
    .join('');

  col.style.gridTemplateRows = `repeat(7, ${celda}px)`;
  col.style.width = HEAT_ANCHO_ETIQUETAS + 'px';
  col.innerHTML = INICIALES.map(
    (d) => `<span class="font-sans text-[10px] text-outline leading-none flex items-center justify-center">${d}</span>`
  ).join('');

  const titulo = document.getElementById('heat-titulo');
  if (titulo) titulo.textContent = textoPeriodo(semanas);
}

/* Reloj de 24 horas: cada hora es un radio que crece con lo leído en esa
   franja. En barras horizontales no se veía el ciclo del día; en círculo la
   madrugada, la mañana y la noche quedan donde uno las espera. */
const RELOJ = { cx: 120, cy: 120, r0: 46, r1: 104, rEtiqueta: 119 };

function relojHoras(byHour) {
  const { cx, cy, r0, r1, rEtiqueta } = RELOJ;
  const max = Math.max(1, ...byHour.map((h) => h.chapters));
  const total = byHour.reduce((n, h) => n + h.chapters, 0);
  const pico = byHour.reduce((a, b) => (b.chapters > a.chapters ? b : a), byHour[0]);
  // Las 00:00 arriba y el día avanzando en el sentido de las agujas.
  const ang = (h) => ((h * 15 - 90) * Math.PI) / 180;
  const px = (h, r) => [cx + r * Math.cos(ang(h)), cy + r * Math.sin(ang(h))];
  const linea = (h, desde, hasta, color, op) => {
    const [x1, y1] = px(h, desde);
    const [x2, y2] = px(h, hasta);
    return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="7" stroke-linecap="round" opacity="${op}"/>`;
  };

  const radios = byHour
    .map((h) => {
      const ratio = h.chapters / max;
      const largo = r0 + 3 + (r1 - r0 - 3) * ratio;
      const [tx, ty] = px(h.hour, largo);
      const hh = String(h.hour).padStart(2, '0');
      const caps = EN ? (h.chapters === 1 ? 'chapter' : 'chapters') : h.chapters === 1 ? 'capítulo' : 'capítulos';
      const titulo = `${hh}:00 · ${h.chapters} ${caps}${h.minutes ? ' · ' + fmtMinutes(h.minutes) : ''}`;
      return `<g>
        ${linea(h.hour, r0 + 3, r1, 'rgb(var(--tk-surface-container-high))', 1)}
        ${h.chapters ? linea(h.hour, r0 + 3, largo, 'rgb(var(--tk-secondary-container))', (0.45 + 0.55 * ratio).toFixed(2)) : ''}
        ${h.chapters && h.hour === pico.hour ? `<circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="3.4" fill="rgb(var(--tk-secondary))"/>` : ''}
        <title>${titulo}</title>
      </g>`;
    })
    .join('');

  const marcas = [0, 3, 6, 9, 12, 15, 18, 21]
    .map((h) => {
      const [x, y] = px(h, rEtiqueta);
      return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" fill="rgb(var(--tk-outline))">${String(h).padStart(2, '0')}</text>`;
    })
    .join('');

  const centro = total
    ? `<text x="${cx}" y="${cy - 14}" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="0.8" fill="rgb(var(--tk-outline))">${EN ? 'PEAK HOUR' : 'HORA PICO'}</text>
       <text x="${cx}" y="${cy + 9}" text-anchor="middle" font-size="24" font-weight="800" fill="rgb(var(--tk-secondary))">${String(pico.hour).padStart(2, '0')}:00</text>
       <text x="${cx}" y="${cy + 26}" text-anchor="middle" font-size="10" fill="rgb(var(--tk-outline))">${pico.chapters} ${EN ? 'ch' : 'caps'}</text>`
    : `<text x="${cx}" y="${cy + 4}" text-anchor="middle" font-size="11" fill="rgb(var(--tk-outline))">${EN ? 'No data yet' : 'Aún sin datos'}</text>`;

  return `<svg viewBox="-8 -8 256 256" class="w-full max-w-[280px] mx-auto" font-family="Plus Jakarta Sans, sans-serif">
    <circle cx="${cx}" cy="${cy}" r="${r0 - 4}" fill="rgb(var(--tk-surface-container))"/>
    ${radios}
    ${marcas}
    ${centro}
  </svg>`;
}

/* Las cuatro franjas del día con su peso: el reloj enseña la forma y esto
   pone el número. */
function franjasHTML(byHour) {
  const total = byHour.reduce((n, h) => n + h.chapters, 0);
  const franjas = [
    { label: EN ? 'Late night' : 'Madrugada', icono: 'bedtime', desde: 0 },
    { label: EN ? 'Morning' : 'Mañana', icono: 'wb_twilight', desde: 6 },
    { label: EN ? 'Afternoon' : 'Tarde', icono: 'light_mode', desde: 12 },
    { label: EN ? 'Evening' : 'Noche', icono: 'dark_mode', desde: 18 },
  ];
  return `<div class="grid grid-cols-4 gap-1.5">
    ${franjas
      .map((f) => {
        const caps = byHour.slice(f.desde, f.desde + 6).reduce((n, h) => n + h.chapters, 0);
        const pct = total ? Math.round((caps / total) * 100) : 0;
        return `<div class="rounded-lg bg-surface-container-high/60 px-1 py-2 flex flex-col items-center gap-0.5">
          <span translate="no" class="material-symbols-outlined text-secondary text-[16px]">${f.icono}</span>
          <span class="font-sans text-label-sm text-on-surface font-bold">${pct}%</span>
          <span class="font-sans text-[10px] leading-tight text-outline text-center">${f.label}</span>
        </div>`;
      })
      .join('')}
  </div>`;
}

/* Días de la semana en columnas: el día fuerte se ve por altura y queda
   marcado con su nombre resaltado. */
function columnasDias(byWeekday) {
  const max = Math.max(1, ...byWeekday.map((d) => d.chapters));
  const mejor = byWeekday.reduce((a, b) => (b.chapters > a.chapters ? b : a), byWeekday[0]);
  return `<div class="flex items-end gap-1 sm:gap-1.5 flex-1 min-h-[180px]">
    ${byWeekday
      .map((d, i) => {
        const pct = Math.round((d.chapters / max) * 100);
        const esMejor = d.chapters > 0 && i === mejor.weekday;
        const titulo = `${DIAS[i]}: ${d.chapters} ${EN ? 'ch' : 'caps'}${d.minutes ? ' · ' + fmtMinutes(d.minutes) : ''}`;
        return `<div class="flex-1 min-w-0 h-full flex flex-col items-center gap-1.5" title="${titulo}">
          <div class="w-full flex-1 min-h-0 flex flex-col justify-end items-center gap-1">
            <span class="font-sans text-label-sm ${esMejor ? 'text-primary font-bold' : 'text-on-surface-variant'}">${d.chapters}</span>
            <div class="w-full rounded-t-lg rounded-b-sm ${esMejor ? 'bg-gradient-to-t from-tertiary-container to-primary-container' : 'bg-gradient-to-t from-primary-container/35 to-primary-container/75'}" style="height:${Math.max(3, pct)}%;max-height:calc(100% - 20px)"></div>
          </div>
          <span class="w-full text-center rounded-md py-0.5 font-sans text-label-sm ${esMejor ? 'bg-primary-container text-on-primary-container' : 'text-on-surface-variant'}">${DIAS[i].slice(0, 3)}</span>
        </div>`;
      })
      .join('')}
  </div>`;
}

/* Rango de una semana en texto corto: "3–9 nov" o "28 oct – 3 nov". */
function rangoSemana(inicio, fin) {
  const loc = EN ? 'en' : 'es';
  const a = new Date(inicio + 'T12:00:00');
  const b = new Date(fin + 'T12:00:00');
  const mes = (d) => d.toLocaleDateString(loc, { month: 'short' }).replace('.', '');
  return mes(a) === mes(b)
    ? `${a.getDate()}–${b.getDate()} ${mes(b)}`
    : `${a.getDate()} ${mes(a)}–${b.getDate()} ${mes(b)}`;
}

/* Historial de las últimas semanas: capítulos y tiempo, nada más. */
function historialSemanal(weekly) {
  const max = Math.max(1, ...weekly.map((w) => w.chapters));
  const caps = weekly.reduce((n, w) => n + w.chapters, 0);
  const mins = weekly.reduce((n, w) => n + w.minutes, 0);
  const medidos = weekly.reduce((n, w) => n + (w.chapters * w.measuredPct) / 100, 0);
  const filas = weekly
    .slice()
    .reverse()
    .map((w, i) => {
      const actual = i === 0;
      const pct = Math.round((w.chapters / max) * 100);
      const t = fmtMinutesParts(w.minutes);
      return `<div class="flex items-center gap-element-gap-sm">
        <span class="w-[88px] sm:w-[104px] shrink-0 whitespace-nowrap font-sans text-label-sm ${actual ? 'text-primary font-bold' : 'text-on-surface-variant'}">${actual ? (EN ? 'This week' : 'Esta semana') : rangoSemana(w.start, w.end)}</span>
        <div class="flex-1 min-w-0 h-2.5 rounded-full bg-surface-container-high overflow-hidden">
          <div class="h-full rounded-full ${actual ? 'bg-primary-container' : 'bg-primary-container/50'}" style="width:${pct}%"></div>
        </div>
        <span class="w-[38px] shrink-0 text-right font-sans text-label-sm font-bold ${w.chapters ? 'text-on-surface' : 'text-outline'}">${w.chapters}</span>
        <span class="w-[56px] shrink-0 text-right font-sans text-label-sm font-bold ${w.minutes ? 'text-secondary' : 'text-outline'}">${w.minutes ? aprox(t.valor, w.measuredPct) + ' ' + t.unidad : '—'}</span>
      </div>`;
    })
    .join('');

  return `<div class="rounded-xl bg-surface-container-low p-card-padding-md shadow-lg mb-element-gap-lg flex flex-col gap-element-gap-md">
    <div class="flex items-center justify-between gap-2 flex-wrap">
      <h3 class="font-serif text-headline-sm text-on-surface">${EN ? 'Week by week' : 'Semana a semana'}</h3>
      <span class="font-sans text-label-sm text-outline">${EN ? `Last ${weekly.length} weeks` : `Últimas ${weekly.length} semanas`}</span>
    </div>
    <div class="flex items-center gap-element-gap-sm">
      <span class="w-[88px] sm:w-[104px] shrink-0"></span>
      <div class="flex-1 min-w-0"></div>
      <span class="w-[38px] shrink-0 text-right font-sans text-[10px] text-outline">${EN ? 'Ch.' : 'Caps'}</span>
      <span class="w-[56px] shrink-0 text-right font-sans text-[10px] text-outline">${EN ? 'Time' : 'Tiempo'}</span>
    </div>
    <div class="flex flex-col gap-element-gap-sm">${filas}</div>
    <p class="font-sans text-label-sm text-outline">
      ${
        caps
          ? `${caps} ${EN ? 'chapters' : 'capítulos'} · ${aprox(fmtMinutes(mins), Math.round((medidos / caps) * 100))} ${EN ? 'in this period' : 'en el periodo'}`
          : EN
          ? 'No reading in this period yet.'
          : 'Todavía no hay lecturas en este periodo.'
      }
    </p>
  </div>`;
}

function statsBlock(s) {
  const semana = fmtMinutesParts(s.week.minutes);
  const porCap = fmtMinutesParts(s.perChapter.minutes);
  const totalDias = s.byWeekday.reduce((n, d) => n + d.chapters, 0);
  const mejorDiaSemana = s.byWeekday.reduce((a, b) => (b.chapters > a.chapters ? b : a), s.byWeekday[0]);
  const horaPico = s.byHour.reduce((a, b) => (b.chapters > a.chapters ? b : a), s.byHour[0]);
  const pctMejorDia = totalDias ? Math.round((mejorDiaSemana.chapters / totalDias) * 100) : 0;

  return `
    <div class="flex items-center gap-2 mb-element-gap-lg">
      <span translate="no" class="material-symbols-outlined text-primary text-[22px]">insights</span>
      <h2 class="font-serif text-headline-md text-on-surface">${EN ? 'Your Reading Week' : 'Tu Semana de Lectura'}</h2>
    </div>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-gutter-tablet mb-element-gap-lg ro-stagger">
      ${tarjetaSemana(EN ? 'Chapters' : 'Capítulos', 'auto_stories', s.week.chapters, EN ? 'this week' : 'esta semana', chipDelta(s.delta.chapters), 'text-primary')}
      ${tarjetaSemana(EN ? 'Time read' : 'Tiempo leído', 'schedule', aprox(semana.valor, s.week.measuredPct), semana.unidad + (EN ? ' this week' : ' esta semana'), chipDelta(s.delta.minutes), 'text-secondary')}
      ${tarjetaSemana(EN ? 'Current streak' : 'Racha actual', 'local_fire_department', s.streak.current, EN ? (s.streak.current === 1 ? 'day' : 'days') : s.streak.current === 1 ? 'día' : 'días', `<span class="font-sans text-label-sm text-outline">${EN ? 'Record' : 'Récord'}: ${s.streak.record} ${EN ? (s.streak.record === 1 ? 'day' : 'days') : s.streak.record === 1 ? 'día' : 'días'}</span>`, 'text-primary')}
      ${tarjetaSemana(EN ? 'Per chapter' : 'Por capítulo', 'timer', aprox(porCap.valor, s.perChapter.measured ? 100 : 0), porCap.unidad + (EN ? ' on average' : ' de media'), `<span class="font-sans text-label-sm text-outline">${s.wpm.measured ? s.wpm.value + (EN ? ' words/min' : ' palabras/min') : (EN ? 'estimated at ' : 'estimado a ') + s.wpm.value + (EN ? ' wpm' : ' ppm')}</span>`, 'text-secondary')}
    </div>

    <div class="rounded-xl bg-surface-container-low p-card-padding-md shadow-lg mb-element-gap-lg">
      <div class="flex items-center justify-between gap-2 mb-element-gap-md flex-wrap">
        <h3 id="heat-titulo" class="font-serif text-headline-sm text-on-surface">${EN ? 'Last 6 months' : 'Últimos 6 meses'}</h3>
        <div class="flex items-center gap-1.5">
          <span class="font-sans text-label-sm text-outline">${EN ? 'less' : 'menos'}</span>
          ${[0, 1, 2, 3, 4].map((n) => `<div class="w-3 h-3 rounded-[3px] ${n === 0 ? 'bg-surface-container-high' : 'bg-primary-container'}" style="${n ? 'opacity:' + [0, 0.2, 0.42, 0.7, 1][n] : ''}"></div>`).join('')}
          <span class="font-sans text-label-sm text-outline">${EN ? 'more' : 'más'}</span>
        </div>
      </div>
      ${heatmapHTML()}
      <p class="font-sans text-label-sm text-outline mt-element-gap-md">
        ${
          EN
            ? `${s.totals.chapters} chapters across ${s.totals.activeDays} reading day${s.totals.activeDays === 1 ? '' : 's'} · ${aprox(fmtMinutes(s.totals.minutes), s.totals.measuredPct)} in total`
            : `${s.totals.chapters} capítulos en ${s.totals.activeDays} día${s.totals.activeDays === 1 ? '' : 's'} de lectura · ${aprox(fmtMinutes(s.totals.minutes), s.totals.measuredPct)} en total`
        }
      </p>
    </div>

    ${historialSemanal(s.weekly)}

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-gutter-tablet mb-stack-gap-xl">
      <div class="rounded-xl bg-surface-container-low p-card-padding-md shadow-lg flex flex-col gap-element-gap-md">
        <div class="flex items-center gap-2">
          <span translate="no" class="material-symbols-outlined text-primary text-[20px]">calendar_month</span>
          <h3 class="font-serif text-headline-sm text-on-surface">${EN ? 'Your favourite day' : 'Tu día favorito'}</h3>
        </div>
        ${columnasDias(s.byWeekday)}
        <p class="font-sans text-label-sm text-outline">
          ${
            !mejorDiaSemana.chapters
              ? EN ? 'Not enough history yet.' : 'Aún no hay suficiente historial.'
              : EN
              ? `You read most on ${DIAS[mejorDiaSemana.weekday]}s — ${pctMejorDia}% of your chapters.`
              : `Lees más los ${diaPlural(mejorDiaSemana.weekday)}: el ${pctMejorDia}% de tus capítulos.`
          }
        </p>
      </div>
      <div class="rounded-xl bg-surface-container-low p-card-padding-md shadow-lg flex flex-col gap-element-gap-md">
        <div class="flex items-center gap-2">
          <span translate="no" class="material-symbols-outlined text-secondary text-[20px]">schedule</span>
          <h3 class="font-serif text-headline-sm text-on-surface">${EN ? 'When you read' : 'A qué hora lees'}</h3>
        </div>
        ${relojHoras(s.byHour)}
        ${franjasHTML(s.byHour)}
        <p class="font-sans text-label-sm text-outline">
          ${
            !horaPico.chapters
              ? EN ? 'Not enough history yet.' : 'Aún no hay suficiente historial.'
              : (EN ? 'Your peak hour is ' : 'Tu hora pico es a las ') + String(horaPico.hour).padStart(2, '0') + ':00.'
          }
        </p>
      </div>
    </div>`;
}

function duelRow(d) {
  const won = d.iWon;
  return `<a href="/duelo?id=${d.id}" class="flex items-center gap-element-gap-md rounded-xl bg-surface-container-low hover:bg-surface-container p-card-padding-sm shadow-lg transition-all group">
    ${coverHTML(d, 'shrink-0 w-14 h-20 rounded-lg shadow-xl')}
    <div class="min-w-0 flex-1">
      <h3 class="font-serif text-headline-sm text-on-surface truncate group-hover:text-primary transition-colors">${esc(d.bookTitle)}</h3>
      <p class="font-sans text-body-sm text-on-surface-variant mt-1 truncate">
        vs <span class="text-secondary">@${esc(d.rival ? d.rival.username : '—')}</span>
        • ${d.myStats.chaptersRead} caps vs ${d.rivalStats ? d.rivalStats.chaptersRead : 0} caps
        • ${timeAgo(d.finishedAt)}
      </p>
    </div>
    <span class="shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg font-sans text-label-sm font-bold ${won ? 'bg-primary-container/20 text-primary' : 'bg-error-container/25 text-error'}">
      <span translate="no" class="material-symbols-outlined text-[16px]">${won ? 'trophy' : 'close'}</span> ${won ? 'VICTORIA' : 'DERROTA'}
    </span>
  </a>`;
}

(async () => {
  await requireAuth('perfil');
  // Las estadísticas son un extra: si fallan, el perfil se pinta igual.
  const [{ user, stats, finishedDuels }, lectura] = await Promise.all([
    api('/api/profile'),
    api('/api/stats').catch(() => null),
  ]);
  const memberSince = new Date(user.memberSince.replace(' ', 'T') + 'Z')
    .toLocaleDateString('es', { month: 'long', year: 'numeric' });

  document.getElementById('content').innerHTML = `
    <!-- Cabecera de perfil -->
    <div class="rounded-xl bg-surface-container-low p-card-padding-md md:p-card-padding-lg shadow-xl mb-stack-gap-xl relative overflow-hidden">
      <div class="absolute -top-24 -right-24 w-80 h-80 rounded-full bg-primary/10 blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-24 -left-16 w-64 h-64 rounded-full bg-secondary/10 blur-3xl pointer-events-none"></div>
      <div class="relative z-10 flex flex-col md:flex-row md:items-center gap-element-gap-lg">
        <div class="relative w-24 h-24 md:w-28 md:h-28 shrink-0 rounded-full p-[3px] bg-gradient-to-br from-primary-container via-tertiary-container to-secondary-container">
          <div class="w-full h-full rounded-full bg-surface-container-lowest flex items-center justify-center">
            <span class="font-serif font-bold text-[34px] text-primary">${esc(initials(user.displayName))}</span>
          </div>
          <span class="absolute bottom-0 right-1 w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center ring-4 ring-surface-container-low">
            <span translate="no" class="material-symbols-outlined text-primary text-[16px]">auto_stories</span>
          </span>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-baseline gap-element-gap-sm flex-wrap">
            <h1 class="font-serif text-headline-xl md:text-display-hero text-on-surface tracking-tight">${esc(user.displayName)}</h1>
            <span class="font-sans text-body-md text-outline">@${esc(user.username)}</span>
          </div>
          <div class="flex items-center gap-element-gap-sm flex-wrap mt-element-gap-sm">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-primary-container/15 text-primary font-sans text-label-sm font-bold"><span translate="no" class="material-symbols-outlined text-[16px]">military_tech</span> ${stats.wins >= 10 ? 'Gran Maestro de Lectura' : stats.wins >= 3 ? 'Duelista Experimentado' : 'Lector en Ascenso'}</span>
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container text-on-surface-variant font-sans text-label-sm"><span translate="no" class="material-symbols-outlined text-[16px]">calendar_month</span> Miembro desde ${esc(memberSince)}</span>
          </div>
        </div>
        <a href="/nuevo" class="shrink-0 inline-flex items-center gap-2 px-card-padding-md py-3 rounded-lg bg-primary-container hover:bg-tertiary-fixed-dim text-on-primary-container font-sans text-label-md font-bold shadow-lg shadow-primary-container/25 transition-all active:scale-95 self-start md:self-center">
          <span translate="no" class="material-symbols-outlined text-[20px]">swords</span> Retar a Duelo
        </a>
      </div>
    </div>

    <!-- Métricas -->
    <div class="flex items-center gap-2 mb-element-gap-lg">
      <span translate="no" class="material-symbols-outlined text-primary text-[22px]">monitoring</span>
      <h2 class="font-serif text-headline-md text-on-surface">Métricas de Combate Literario</h2>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-gutter-tablet mb-stack-gap-xl ro-stagger">
      ${metric('Duelos Ganados', 'trophy', stats.wins, 'victorias', stats.winRate, ['Tasa de victoria', stats.winRate + '%'], 'text-primary')}
      ${metric('Duelos Perdidos', 'flag', stats.losses, 'derrotas', stats.finishedDuels ? Math.round((stats.losses / stats.finishedDuels) * 100) : 0, ['Total contiendas', stats.finishedDuels + ' disputadas'], 'text-error')}
      ${metric('Capítulos Leídos', 'auto_stories', stats.totalChapters.toLocaleString('es'), 'caps', Math.min(100, stats.totalChapters), ['Duelos totales', stats.totalDuels + ''], 'text-secondary')}
      ${metric('Mayor Racha', 'local_fire_department', stats.longestStreak, 'días seguidos', Math.min(100, stats.longestStreak * 5), ['Días con lectura', 'récord personal'], 'text-primary')}
    </div>

    <!-- Estadísticas de lectura -->
    ${lectura ? statsBlock(lectura) : ''}

    <!-- Duelos finalizados -->
    <div class="flex items-center justify-between mb-element-gap-lg">
      <div class="flex items-center gap-element-gap-sm">
        <h2 class="font-serif text-headline-md text-on-surface">Duelos Finalizados</h2>
        <span class="px-2.5 py-0.5 rounded-full bg-surface-container text-on-surface-variant font-sans text-label-sm">${finishedDuels.length}</span>
      </div>
      <a href="/duelos" class="font-sans text-label-md text-secondary hover:underline flex items-center gap-1">Ver todos mis duelos <span translate="no" class="material-symbols-outlined text-[16px]">arrow_forward</span></a>
    </div>
    <div class="flex flex-col gap-gutter-mobile">
      ${finishedDuels.length ? finishedDuels.map(duelRow).join('') : `
        <div class="rounded-xl bg-surface-container-low p-card-padding-lg text-center flex flex-col items-center gap-element-gap-md">
          <span translate="no" class="material-symbols-outlined text-outline text-[36px]">history_edu</span>
          <p class="font-sans text-body-md text-on-surface-variant">Todavía no has terminado ningún duelo. ¡Tu primer trofeo te espera!</p>
        </div>`}
    </div>`;

  contarNumeros();

  // El heatmap necesita saber el ancho real, así que se pinta ya montado y se
  // recalcula al girar el móvil o cambiar el tamaño de la ventana.
  if (lectura) {
    pintarHeatmap(lectura.heatmap);
    observarHeatmap(lectura.heatmap);
  }
})();
</script>
</body>
</html>
