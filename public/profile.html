<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReadOff — Mi Perfil</title>
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/js/tw.js"></script>
<link rel="stylesheet" href="/css/theme.css">
<script>try{if(localStorage.getItem("theme")==="light")document.documentElement.classList.add("light")}catch(e){}</script>
<style>body{margin:0;overscroll-behavior:none} ::-webkit-scrollbar{display:none}</style>
</head>
<body class="bg-background font-sans text-body-md text-on-background min-h-screen selection:bg-primary selection:text-on-primary">
<div id="header"></div>

<main class="w-full pt-16 md:pt-20 min-h-screen">
  <div class="max-w-[1280px] mx-auto px-gutter-mobile md:px-gutter-tablet lg:px-gutter-desktop py-stack-gap-xl" id="content">
    <div class="flex items-center justify-center py-24 text-outline gap-2">
      <span class="material-symbols-outlined animate-spin">progress_activity</span> Cargando perfil…
    </div>
  </div>
</main>

<script src="/js/app.js"></script>
<script>
function metric(label, icon, value, unit, barPct, barNote, accent) {
  return `<div class="rounded-xl bg-surface-container-low p-card-padding-md shadow-lg flex flex-col gap-element-gap-md relative overflow-hidden">
    <div class="flex items-center justify-between">
      <span class="font-sans text-label-md text-on-surface-variant">${label}</span>
      <div class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center"><span class="material-symbols-outlined ${accent} text-[22px]">${icon}</span></div>
    </div>
    <div class="flex items-baseline gap-2">
      <span class="font-sans font-extrabold text-[40px] leading-none ${accent}">${value}</span>
      <span class="font-sans text-body-sm text-outline">${unit}</span>
    </div>
    <div class="flex flex-col gap-1.5">
      <div class="flex justify-between font-sans text-label-sm text-on-surface-variant"><span>${barNote[0]}</span><span class="font-bold">${barNote[1]}</span></div>
      <div class="w-full h-1.5 rounded-full bg-surface-container-lowest overflow-hidden"><div class="h-full rounded-full ${accent === 'text-secondary' ? 'bg-secondary-container' : accent === 'text-error' ? 'bg-error-container' : 'bg-gradient-to-r from-tertiary-container to-primary'}" style="width:${barPct}%"></div></div>
    </div>
  </div>`;
}

function duelRow(d) {
  const won = d.iWon;
  return `<a href="/duelo?id=${d.id}" class="flex items-center gap-element-gap-md rounded-xl bg-surface-container-low hover:bg-surface-container p-card-padding-sm shadow-lg transition-all group">
    ${coverHTML(d, 'shrink-0 w-14 h-20 rounded-lg shadow-xl')}
    <div class="min-w-0 flex-1">
      <h3 class="font-serif text-headline-sm text-on-surface truncate group-hover:text-primary transition-colors">${esc(d.bookTitle)}</h3>
      <p class="font-sans text-body-sm text-on-surface-variant mt-1 truncate">
        vs <span class="text-secondary">@${esc(d.rival ? d.rival.username : '—')}</span>
        • ${d.myStats.chaptersRead} caps vs ${d.rivalStats ? d.rivalStats.chaptersRead : 0} caps
        • ${timeAgo(d.finishedAt)}
      </p>
    </div>
    <span class="shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg font-sans text-label-sm font-bold ${won ? 'bg-primary-container/20 text-primary' : 'bg-error-container/25 text-error'}">
      <span class="material-symbols-outlined text-[16px]">${won ? 'trophy' : 'close'}</span> ${won ? 'VICTORIA' : 'DERROTA'}
    </span>
  </a>`;
}

(async () => {
  await requireAuth('perfil');
  const { user, stats, finishedDuels } = await api('/api/profile');
  const memberSince = new Date(user.memberSince.replace(' ', 'T') + 'Z')
    .toLocaleDateString('es', { month: 'long', year: 'numeric' });

  document.getElementById('content').innerHTML = `
    <!-- Cabecera de perfil -->
    <div class="rounded-xl bg-surface-container-low p-card-padding-md md:p-card-padding-lg shadow-xl mb-stack-gap-xl relative overflow-hidden">
      <div class="absolute -top-24 -right-24 w-80 h-80 rounded-full bg-primary/10 blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-24 -left-16 w-64 h-64 rounded-full bg-secondary/10 blur-3xl pointer-events-none"></div>
      <div class="relative z-10 flex flex-col md:flex-row md:items-center gap-element-gap-lg">
        <div class="relative w-24 h-24 md:w-28 md:h-28 shrink-0 rounded-full p-[3px] bg-gradient-to-br from-primary-container via-tertiary-container to-secondary-container">
          <div class="w-full h-full rounded-full bg-surface-container-lowest flex items-center justify-center">
            <span class="font-serif font-bold text-[34px] text-primary">${esc(initials(user.displayName))}</span>
          </div>
          <span class="absolute bottom-0 right-1 w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center ring-4 ring-surface-container-low">
            <span class="material-symbols-outlined text-primary text-[16px]">auto_stories</span>
          </span>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-baseline gap-element-gap-sm flex-wrap">
            <h1 class="font-serif text-headline-xl md:text-display-hero text-on-surface tracking-tight">${esc(user.displayName)}</h1>
            <span class="font-sans text-body-md text-outline">@${esc(user.username)}</span>
          </div>
          <div class="flex items-center gap-element-gap-sm flex-wrap mt-element-gap-sm">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-primary-container/15 text-primary font-sans text-label-sm font-bold"><span class="material-symbols-outlined text-[16px]">military_tech</span> ${stats.wins >= 10 ? 'Gran Maestro de Lectura' : stats.wins >= 3 ? 'Duelista Experimentado' : 'Lector en Ascenso'}</span>
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container text-on-surface-variant font-sans text-label-sm"><span class="material-symbols-outlined text-[16px]">calendar_month</span> Miembro desde ${esc(memberSince)}</span>
          </div>
        </div>
        <a href="/nuevo" class="shrink-0 inline-flex items-center gap-2 px-card-padding-md py-3 rounded-lg bg-primary-container hover:bg-tertiary-fixed-dim text-on-primary-container font-sans text-label-md font-bold shadow-lg shadow-primary-container/25 transition-all active:scale-95 self-start md:self-center">
          <span class="material-symbols-outlined text-[20px]">swords</span> Retar a Duelo
        </a>
      </div>
    </div>

    <!-- Métricas -->
    <div class="flex items-center gap-2 mb-element-gap-lg">
      <span class="material-symbols-outlined text-primary text-[22px]">monitoring</span>
      <h2 class="font-serif text-headline-md text-on-surface">Métricas de Combate Literario</h2>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-gutter-tablet mb-stack-gap-xl">
      ${metric('Duelos Ganados', 'trophy', stats.wins, 'victorias', stats.winRate, ['Tasa de victoria', stats.winRate + '%'], 'text-primary')}
      ${metric('Duelos Perdidos', 'flag', stats.losses, 'derrotas', stats.finishedDuels ? Math.round((stats.losses / stats.finishedDuels) * 100) : 0, ['Total contiendas', stats.finishedDuels + ' disputadas'], 'text-error')}
      ${metric('Capítulos Leídos', 'auto_stories', stats.totalChapters.toLocaleString('es'), 'caps', Math.min(100, stats.totalChapters), ['Duelos totales', stats.totalDuels + ''], 'text-secondary')}
      ${metric('Mayor Racha', 'local_fire_department', stats.longestStreak, 'días seguidos', Math.min(100, stats.longestStreak * 5), ['Días con lectura', 'récord personal'], 'text-primary')}
    </div>

    <!-- Duelos finalizados -->
    <div class="flex items-center justify-between mb-element-gap-lg">
      <div class="flex items-center gap-element-gap-sm">
        <h2 class="font-serif text-headline-md text-on-surface">Duelos Finalizados</h2>
        <span class="px-2.5 py-0.5 rounded-full bg-surface-container text-on-surface-variant font-sans text-label-sm">${finishedDuels.length}</span>
      </div>
      <a href="/duelos" class="font-sans text-label-md text-secondary hover:underline flex items-center gap-1">Ver todos mis duelos <span class="material-symbols-outlined text-[16px]">arrow_forward</span></a>
    </div>
    <div class="flex flex-col gap-gutter-mobile">
      ${finishedDuels.length ? finishedDuels.map(duelRow).join('') : `
        <div class="rounded-xl bg-surface-container-low p-card-padding-lg text-center flex flex-col items-center gap-element-gap-md">
          <span class="material-symbols-outlined text-outline text-[36px]">history_edu</span>
          <p class="font-sans text-body-md text-on-surface-variant">Todavía no has terminado ningún duelo. ¡Tu primer trofeo te espera!</p>
        </div>`}
    </div>`;
})();
</script>
</body>
</html>
